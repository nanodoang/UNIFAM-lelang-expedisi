<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kesepakatan Rate — Lelang UNIFAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky-deep:#1E88E5; --sky:#3FA3F2; --sky-light:#EAF4FD;
  --panel:#FFFFFF; --line:#D8E9FB; --text:#14293D; --muted:#5C7896;
  --amber:#F2A93B; --teal:#0FA894; --red:#E1554D;
  --mono:'JetBrains Mono','Courier New',monospace;
  --sans:'Space Grotesk',Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,var(--sky-deep) 0%,var(--sky) 190px,var(--sky-light) 190px,var(--sky-light) 100%);
  color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:60px;}
header{max-width:1080px;margin:0 auto;padding:30px 24px 18px;color:#fff;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.75);text-transform:uppercase;margin-bottom:8px;}
h1{font-size:clamp(22px,5vw,28px);margin:0 0 6px;letter-spacing:-0.01em;}
.sub{color:rgba(255,255,255,.85);font-size:13.5px;max-width:560px;line-height:1.55;}
#status-bar{max-width:1080px;margin:0 auto 12px;padding:0 24px;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
#status-bar.err{color:var(--red);}
main{max-width:1080px;margin:0 auto;padding:0 24px;}

.kendali{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.tombol-jenis{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(30,136,229,.07);}
.tombol-jenis button{background:transparent;border:none;padding:11px 24px;font-family:var(--sans);
  font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;}
.tombol-jenis button.aktif{background:var(--sky-deep);color:#fff;}
.tombol-jenis button:not(.aktif):hover{background:#F4F9FE;color:var(--text);}
.cari{flex:1;min-width:200px;}
.cari input{width:100%;background:var(--panel);border:1.5px solid var(--line);color:var(--text);
  padding:11px 14px;border-radius:10px;font-size:13.5px;font-family:var(--sans);}
.cari input:focus{outline:none;border-color:var(--sky-deep);}
.btn-salin{background:var(--panel);border:1.5px solid var(--line);color:var(--muted);border-radius:10px;
  font-weight:600;font-size:12.5px;padding:11px 16px;cursor:pointer;font-family:var(--sans);white-space:nowrap;}
.btn-salin:hover{border-color:var(--sky-deep);color:var(--sky-deep);}

.kotak-tabel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,136,229,.07);}
.gulir{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;padding:12px 14px;border-bottom:1.5px solid var(--line);background:#FBFDFF;
  white-space:nowrap;position:sticky;top:0;}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBFDFF;}
.distributor{font-weight:700;}
.kode-kecil{font-family:var(--mono);font-size:9.5px;background:#EAF4FD;color:var(--sky-deep);
  padding:2px 6px;border-radius:20px;margin-left:6px;}
.kota{font-family:var(--mono);font-size:12px;}
.alamat{color:var(--muted);font-size:12px;max-width:240px;line-height:1.5;}
.kol-rate{text-align:right;}
td.rate{text-align:right;}
.rate{font-family:var(--mono);font-weight:700;white-space:nowrap;}
.leadtime{font-family:var(--mono);white-space:nowrap;}
.kosong-sel{color:#B8C6D8;font-style:italic;font-size:12px;}
.tak-ada{text-align:center;color:var(--muted);font-size:13px;padding:44px 20px;font-style:italic;}
.ringkas{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted);}
footer{max-width:1080px;margin:30px auto 0;padding:16px 24px;color:#8FA7C2;font-size:11px;
  font-family:var(--mono);border-top:1px solid var(--line);line-height:1.7;}

.logo-unifam{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 7px;}
.baris-judul{display:flex;align-items:center;gap:13px;margin-bottom:6px;}
.baris-judul h1{margin:0;}

.tirai-salin{position:fixed;inset:0;background:rgba(20,41,61,.55);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:120;}
.kotak-salin{background:var(--panel);border-radius:14px;padding:20px;max-width:520px;width:100%;
  box-shadow:0 12px 40px rgba(20,41,61,.3);}
.kotak-salin b{font-size:15px;}
.kotak-salin p{font-size:12.5px;color:var(--muted);margin:5px 0 11px;line-height:1.55;}
.kotak-salin textarea{width:100%;height:190px;font-family:var(--mono);font-size:11px;
  border:1.5px solid var(--line);border-radius:8px;padding:10px;resize:vertical;white-space:pre;}
.kotak-salin button{margin-top:11px;width:100%;background:var(--sky-deep);color:#fff;border:none;
  border-radius:8px;font-weight:700;font-size:13.5px;padding:11px;cursor:pointer;font-family:var(--sans);}

/* ==================== TEMA & KERANGKA BERSAMA ==================== */
:root{
  --navy:#2A3180; --navy-tua:#1C2159; --navy-gelap:#161A45;
  --teal:#1596A3; --teal-tua:#0E7A85;
  --kertas:#EFF2F7; --panel:#FFFFFF; --kartu:#FFFFFF;
  --tinta:#12172B; --text:#12172B; --muted:#5A6480;
  --line:#DDE2EC; --line-tebal:#C3CAD9;
  --amber:#D9820F; --red:#C8443A; --teal-hijau:#12876B;
  /* nama lama dipetakan ke warna baru supaya halaman lama ikut berubah */
  --sky-deep:#2A3180; --sky:#3A43A8; --sky-light:#EFF2F7;
  --disp:'Barlow Condensed',Arial,sans-serif;
  --sans:'Barlow',Arial,sans-serif;
  --body:'Barlow',Arial,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}
body{background:var(--kertas)!important;color:var(--tinta);
  font-family:var(--sans);font-size:14.5px;line-height:1.5;margin:0;padding:0!important;}

.rangka{display:grid;grid-template-columns:228px 1fr;min-height:100vh;}
.sisi{background:var(--navy-gelap);color:#fff;display:flex;flex-direction:column;}
.sisi-kop{display:flex;align-items:center;gap:10px;padding:15px 16px;
  border-bottom:1px solid rgba(255,255,255,.1);}
.sisi-kop img{height:32px;width:auto;background:#fff;border-radius:5px;padding:3px 5px;}
.sisi-kop .t{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;line-height:1.05;}
.sisi-kop .s{font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.5);letter-spacing:.04em;}
.sisi nav{padding:10px 0;flex:1;}
.sisi .grup{font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.38);padding:14px 18px 6px;}
.sisi nav a{display:flex;align-items:center;gap:11px;padding:9px 18px;
  color:rgba(255,255,255,.76);text-decoration:none;font-size:14px;
  border-left:3px solid transparent;}
.sisi nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.sisi nav a.aktif{background:var(--navy);color:#fff;border-left-color:var(--teal);font-weight:600;}
.sisi nav a .ik{width:17px;text-align:center;opacity:.85;}
.sisi-kaki{padding:13px 18px;border-top:1px solid rgba(255,255,255,.1);
  font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.45);line-height:1.7;}

.utama{min-width:0;display:flex;flex-direction:column;}
.bar-atas{background:#fff;border-bottom:1px solid var(--line);padding:11px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40;}
.bar-atas .menu{display:none;background:none;border:1px solid var(--line);
  padding:6px 11px;cursor:pointer;font-size:16px;line-height:1;}
.bar-atas .tajuk{flex:1;min-width:0;}
.bar-atas h1{font-family:var(--disp);font-weight:700;font-size:24px;text-transform:uppercase;
  letter-spacing:.03em;margin:0;line-height:1.1;color:var(--tinta);}
.bar-atas .ket{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
.bar-atas .aksi{display:flex;align-items:center;gap:9px;}
.bar-atas .aku{display:flex;align-items:center;gap:9px;}
.bar-atas .aku .bulat{width:32px;height:32px;background:var(--navy);color:#fff;display:flex;
  align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px;}
.bar-atas .aku .n{font-weight:600;font-size:13.5px;line-height:1.15;}
.bar-atas .aku .r{font-family:var(--mono);font-size:10px;color:var(--muted);}
.btn-kunci{background:none;border:1px solid var(--line-tebal);color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:6px 12px;cursor:pointer;}
.btn-kunci:hover{border-color:var(--red);color:var(--red);}

.isi{padding:18px 22px 44px;}
.isi > main{max-width:none!important;margin:0!important;padding:0!important;}
.isi > footer{max-width:none!important;margin:26px 0 0!important;padding:15px 0 0!important;
  border-top:1px solid var(--line-tebal);color:#8D96AC;font-size:11.5px;font-family:var(--mono);line-height:1.7;}
.isi > #status-bar{max-width:none!important;margin:0 0 12px!important;padding:0!important;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);}
.isi > #status-bar.err{color:var(--red);}
.isi > #status-bar.ok{color:var(--teal-hijau);}
.isi .peringatan-versi{max-width:none;margin:0 0 14px;}

/* sudut siku & font di seluruh komponen umum */
.panel-box,.kotak-tabel,.card,.kartu-eks,.kartu-angka,.panel,.jendela,
.kotak-masuk,#gerbang .kartu,.lapor,.pesan-salah,.empty-state{border-radius:0!important;}
h1,h2,h3{font-family:var(--disp);letter-spacing:.03em;}
.section-title h2{font-family:var(--disp);font-weight:700;font-size:18px;
  letter-spacing:.05em;text-transform:uppercase;margin:0;}
.balik{display:none!important;}

@media(max-width:900px){
  .rangka{grid-template-columns:1fr;}
  .sisi{position:fixed;inset:0 auto 0 0;width:228px;z-index:120;
    transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(18,23,43,.3);}
  .sisi.buka{transform:none;}
  .bar-atas .menu{display:block;}
  .bar-atas h1{font-size:20px;}
  .isi{padding:15px 16px 40px;}
}


.yatim{font-family:var(--mono);font-size:10.5px;color:var(--amber);font-weight:400;font-style:italic;}

.bar-per{display:flex;align-items:flex-end;gap:11px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);padding:12px 14px;margin-bottom:14px;}
.bar-per label{display:block;font-family:var(--disp);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;}
.bar-per select{background:#fff;border:1px solid var(--line-tebal);padding:9px 11px;
  font-family:var(--mono);font-size:13px;min-width:170px;}
.btn-k{background:var(--navy);color:#fff;border:none;font-family:var(--disp);font-weight:700;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 15px;cursor:pointer;
  text-decoration:none;display:inline-block;}
.btn-k:hover{background:var(--navy-tua);color:#fff;}
.btn-k.putih{background:#fff;color:var(--navy);border:1px solid var(--navy);}
.btn-k.putih:hover{background:var(--navy);color:#fff;}
.btn-k.hijau{background:#12876B;}
.btn-k.hijau:hover{background:#0B6350;}
.kartu-eks{background:var(--panel);border:1px solid var(--line-tebal);margin-bottom:13px;}
.ke-kop{display:flex;align-items:center;gap:11px;padding:12px 15px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer;}
.ke-kop:hover{background:#FAFBFD;}
.ke-nm{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.04em;
  text-transform:uppercase;flex:1;line-height:1.1;}
.ke-dok{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.st-k{font-family:var(--mono);font-size:9.5px;padding:3px 9px;white-space:nowrap;}
.st-k.belum{background:#F1F3F7;color:var(--muted);}
.st-k.diajukan{background:rgba(217,130,15,.16);color:#8A5A0A;}
.st-k.disetujui{background:#12876B;color:#fff;}
.hit-k{font-family:var(--mono);font-size:9.5px;padding:2px 7px;}
.hit-k.naik{background:rgba(200,68,58,.13);color:#A5352C;}
.hit-k.turun{background:rgba(18,135,107,.14);color:#0B6350;}
.hit-k.baru{background:rgba(21,150,163,.14);color:var(--teal-tua);}
.hit-k.tetap{background:#F1F3F7;color:var(--muted);}
.ke-badan{border-top:1px dashed var(--line);}
.ke-kaki{padding:12px 15px;background:#FAFBFD;border-top:1px solid var(--line);
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.ke-kaki .ket{flex:1;font-size:12px;color:var(--muted);line-height:1.6;min-width:170px;}
table.k{width:100%;border-collapse:collapse;font-size:12.5px;}
table.k th{font-family:var(--disp);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  background:#FAFBFD;white-space:nowrap;}
table.k th.kanan{text-align:right;}
table.k td{padding:8px 10px;border-bottom:1px solid var(--line);}
table.k tr:last-child td{border-bottom:none;}
table.k td.mono{font-family:var(--mono);white-space:nowrap;}
table.k td.kanan{text-align:right;font-family:var(--mono);white-space:nowrap;}
table.k tr.naik td{background:#FDF3F2;}
.alasan-k{font-size:11.5px;color:#8A5A0A;font-style:italic;}
.gulir{overflow-x:auto;}
.urut-rute{background:var(--panel);border:1px solid var(--line);margin-bottom:12px;}
.ur-kop{padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);
  font-size:12px;font-weight:600;}
.pil-u{font-family:var(--mono);font-size:9px;padding:2px 7px;white-space:nowrap;}
.pil-u.p1{background:#B8860B;color:#fff;}
.pil-u.p2{background:#8892A8;color:#fff;}
.pil-u.p3{background:#F1F3F7;color:var(--muted);}
.tab-k{display:flex;margin-bottom:14px;background:#fff;border:1px solid var(--line-tebal);width:fit-content;}
.tab-k button{background:none;border:none;font-family:var(--disp);font-weight:600;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;cursor:pointer;color:var(--muted);}
.tab-k button.aktif{background:var(--navy);color:#fff;}
.gerbang{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:90;}
.gerbang-isi{background:#fff;padding:28px 26px;max-width:340px;width:100%;}
.gerbang-isi h2{font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;
  margin:0 0 6px;letter-spacing:.04em;}
.gerbang-isi p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.6;}
.gerbang-isi input{width:100%;border:1px solid var(--line-tebal);padding:11px 13px;
  font-family:var(--mono);font-size:14px;margin-bottom:12px;}
.gerbang-isi button{width:100%;background:var(--navy);color:#fff;border:none;
  font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.09em;
  text-transform:uppercase;padding:12px;cursor:pointer;}
.gerbang-salah{color:var(--red);font-size:12.5px;margin-top:10px;font-family:var(--mono);}
</style>
</head>
<body>

<div class="gerbang" id="gerbang">
  <div class="gerbang-isi">
    <h2>Kesepakatan Rate</h2>
    <p>Masukkan password admin.</p>
    <input id="g-pass" type="password" placeholder="password admin"
           onkeydown="if(event.key==='Enter')masuk()">
    <button onclick="masuk()">Masuk</button>
    <div class="gerbang-salah" id="g-salah"></div>
  </div>
</div>

<div class="rangka">
  <aside class="sisi" id="sisi">

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';

let adminPass = '';
let data = null, urutan = null, tabAktif = 'penawaran';
let periodePilih = '';
let terbuka = {};
let rute = null, ruteDraf = '';
const tembolok = {};          // hasil per periode, hanya selama halaman terbuka

function simpanTembolok(p, d){ tembolok[p] = { d, waktu: Date.now() }; }
function ambilTembolok(p){
  const t = tembolok[p];
  if(!t) return null;
  if(Date.now() - t.waktu > 120000) return null;   // 2 menit
  return t.d;
}

let jsonpN = 0;
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'gascb' + (++jsonpN) + '_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { bersih(); reject(new Error('Timeout — server terlalu lama merespons. Coba muat ulang halaman.')); }, 60000);
    function bersih(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (d) => { bersih(); resolve(d); };
    s.src = url + '&callback=' + cb;
    s.onerror = () => { bersih(); reject(new Error('Gagal terhubung ke Apps Script')); };
    document.body.appendChild(s);
  });
}
async function gas(p){
  return kirimKeServer(p);
}

/* Jalur utama fetch; JSONP hanya cadangan. Kalau keduanya gagal,
   sebab dari jalur utama yang dilaporkan — bukan sekadar "timeout". */
async function kirimKeServer(params){
  const q = Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const url = GAS_URL + '?' + q;

  let sebabUtama = '';
  try {
    const r = await fetch(url);
    if(!r.ok) {
      sebabUtama = 'server menjawab ' + r.status + ' ' + r.statusText;
    } else {
      const teks = await r.text();
      if(/^\s*<(!DOCTYPE|html)/i.test(teks)){
        throw new Error('Server mengembalikan halaman web, bukan data. Biasanya berarti deployment Apps Script perlu diatur ulang ke "Who has access: Anyone".');
      }
      let d;
      try { d = JSON.parse(teks); }
      catch(e){ throw new Error('Jawaban server tidak terbaca: ' + teks.slice(0, 120)); }
      if(d && d.error) throw new Error(d.error);
      return d;
    }
  } catch(e){
    if(!sebabUtama) sebabUtama = e.message;
    // error dari server sendiri tidak perlu diulang lewat jalur cadangan
    if(/password|action tidak dikenal|tidak ditemukan|halaman web|tidak terbaca/i.test(sebabUtama)){
      throw new Error(sebabUtama);
    }
  }

  try {
    const d = await jsonp(url);
    if(d && d.error) throw new Error(d.error);
    return d;
  } catch(e2){
    throw new Error(sebabUtama || e2.message);
  }
}

let semuaBaris = [], tipeDarat = [], tipeLaut = [], jenisAktif = 'darat', infoLeadtim = {};

function setStatus(teks, error){
  const el = document.getElementById('status-bar');
  el.textContent = teks;
  el.className = error ? 'err' : '';
}

function aman(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function rupiah(n){ return Number(n || 0).toLocaleString('id-ID'); }

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni',
               'Juli','Agustus','September','Oktober','November','Desember'];
function labelPeriode(p){
  const b = String(p).split('-');
  return b.length === 2 ? BULAN[Number(b[1])-1] + ' ' + b[0] : p;
}
function daftarPeriode(){
  const out = [], kini = new Date();
  for(let i = -1; i < 5; i++){
    const d = new Date(kini.getFullYear(), kini.getMonth() + 1 - i, 1);
    out.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
  }
  return out;
}

async function masuk(){
  const p = document.getElementById('g-pass').value.trim();
  if(!p){ document.getElementById('g-salah').textContent = 'Password belum diisi.'; return; }
  adminPass = p;
  try{
    await gas({action:'cek_admin', adminPass});
    sessionStorage.setItem('lelang-admin-pass', p);
    document.getElementById('gerbang').style.display = 'none';
    muat();
  }catch(err){
    adminPass = '';
    document.getElementById('g-salah').textContent = 'Password salah.';
  }
}

function gantiPeriode(p){
  periodePilih = p;
  urutan = null; rute = null; ruteDraf = '';
  document.getElementById('wadah').innerHTML =
    '<div class="kartu-eks"><div class="ke-kaki"><span class="ket">Memuat ' +
    labelPeriode(p) + '…</span></div></div>';
  muat();
}
async function gantiTab(t){
  tabAktif = t;
  render();
  /* urutan baru diambil saat benar-benar dibutuhkan */
  if(t === 'rute' && !rute){
    try{
      setStatus('Memuat daftar rute…');
      rute = await gas({action:'rb_rute_baca', adminPass, periode: periodePilih});
      setStatus(rute.daftar.length
        ? rute.daftar.length + ' rute ditentukan untuk ' + rute.labelPeriode
        : 'Belum ada daftar rute untuk ' + rute.labelPeriode);
      render();
    }catch(err){ setStatus('Gagal memuat rute: ' + err.message, true); }
    return;
  }
  if(t === 'urutan' && !urutan){
    try{
      setStatus('Memuat urutan…');
      urutan = await gas({action:'rb_urutan', adminPass, periode: periodePilih});
      setStatus(`${urutan.rute.length} rute punya urutan · ${data.labelPeriode}`);
      render();
    }catch(err){ setStatus('Gagal memuat urutan: ' + err.message, true); }
  }
}
async function togglePanel(nama){
  terbuka[nama] = !terbuka[nama];
  render();
  if(!terbuka[nama]) return;

  const e = data.ekspedisi.find(x => x.nama === nama);
  if(!e || e.baris.length || e.status === 'belum') return;   // sudah ada / tidak perlu

  try{
    e.memuat = true; render();
    const r = await gas({action:'rb_rinci', adminPass, periode: periodePilih, ekspedisi: nama});
    e.baris = r.baris || [];
    e.memuat = false;
    render();
  }catch(err){
    e.memuat = false;
    setStatus('Gagal memuat rincian ' + nama + ': ' + err.message, true);
    render();
  }
}

async function muat(paksa){
  /* pakai hasil yang sudah ada kalau baru saja diambil */
  if(!paksa){
    const simpan = ambilTembolok(periodePilih);
    if(simpan){
      data = simpan; urutan = null;
      setStatus(data.labelPeriode + ' · dari data yang baru diambil');
      render();
      return;
    }
  }
  try{
    setStatus('Memuat…');
    data = await gas({action:'rb_admin', adminPass, periode: periodePilih});
    simpanTembolok(periodePilih, data);
    urutan = null; rute = null;          // dimuat saat tabnya dibuka
    const nunggu = data.ekspedisi.filter(e => e.status === 'diajukan').length;
    const setuju = data.ekspedisi.filter(e => e.status === 'disetujui').length;
    setStatus(data.labelPeriode + ' · ' + nunggu + ' menunggu diperiksa · ' +
              setuju + ' disetujui · ' + data.versi);
    render();
  }catch(err){
    setStatus('Gagal memuat: ' + err.message, true);
    document.getElementById('wadah').innerHTML =
      '<div class="kartu-eks"><div class="ke-kaki"><span class="ket">Tidak bisa memuat: ' +
      aman(err.message) +
      (/action tidak dikenal/i.test(err.message)
        ? '<br><br><b>Code.gs versi terbaru belum di-deploy.</b>' : '') +
      '</span><button class="btn-k" onclick="muat()">Coba lagi</button></div></div>';
  }
}

function tabelRate(e){
  if(e.memuat) return '<div style="padding:20px;text-align:center;color:var(--muted);' +
    'font-size:12.5px;">Memuat rincian…</div>';
  if(!e.baris.length) return '<div style="padding:20px;text-align:center;color:var(--muted);' +
    'font-size:12.5px;">' + (e.status === 'belum'
      ? 'Belum mengisi. Rate periode sebelumnya tetap berlaku.'
      : 'Tidak ada rincian.') + '</div>';

  const baris = e.baris.map(b => {
    const naik = b.rateLama && b.rate > b.rateLama;
    const turun = b.rateLama && b.rate < b.rateLama;
    const tanda = !b.rateLama ? '<span class="hit-k baru">rute baru</span>'
      : naik ? '<span class="hit-k naik">+' + rupiah(b.rate - b.rateLama) + '</span>'
      : turun ? '<span class="hit-k turun">&minus;' + rupiah(b.rateLama - b.rate) + '</span>'
      : '<span class="hit-k tetap">tetap</span>';
    return '<tr class="' + (naik ? 'naik' : '') + '">' +
      '<td class="mono"><b>' + aman(b.kota) + '</b></td>' +
      '<td class="mono">' + aman(b.tipeMobil) + '</td>' +
      '<td class="kanan">' + (b.rateLama ? rupiah(b.rateLama) : '—') + '</td>' +
      '<td class="kanan"><b>' + rupiah(b.rate) + '</b></td>' +
      '<td>' + tanda + '</td>' +
      '<td class="alasan-k">' + aman(b.alasan || '') + '</td></tr>';
  }).join('');

  return '<div class="gulir"><table class="k" style="min-width:640px;"><thead><tr>' +
    '<th>Kota</th><th>Tipe</th><th class="kanan">' + aman(data.labelLalu) + '</th>' +
    '<th class="kanan">' + aman(data.labelPeriode) + '</th>' +
    '<th>Perubahan</th><th>Alasan</th></tr></thead><tbody>' + baris + '</tbody></table></div>';
}

function tautDok(nama, jenis, label, kelas){
  return '<a class="btn-k ' + kelas + '" target="_blank" href="dokumen.html?periode=' +
    periodePilih + '&ekspedisi=' + encodeURIComponent(nama) + '&jenis=' + jenis + '">' +
    label + '</a>';
}

function render(){
  const opsi = daftarPeriode().map(p =>
    '<option value="' + p + '"' + (p === periodePilih ? ' selected' : '') + '>' +
    labelPeriode(p) + '</option>').join('');

  const bar = '<div class="bar-per"><div><label>Periode</label>' +
    '<select onchange="gantiPeriode(this.value)">' + opsi + '</select></div>' +
    '<button class="btn-k putih" onclick="muat(true)">Segarkan</button>' +
    '<button class="btn-k putih" onclick="salinUndangan()">Salin undangan WA</button></div>' +
    '<div class="tab-k">' +
    '<button class="' + (tabAktif === 'penawaran' ? 'aktif' : '') +
      '" onclick="gantiTab(\'penawaran\')">Penawaran</button>' +
    '<button class="' + (tabAktif === 'urutan' ? 'aktif' : '') +
      '" onclick="gantiTab(\'urutan\')">Urutan per rute</button>' +
    '<button class="' + (tabAktif === 'rute' ? 'aktif' : '') +
      '" onclick="gantiTab(\'rute\')">Daftar rute</button></div>';

  let isi = '';

  if(tabAktif === 'penawaran'){
    isi = data.ekspedisi.map(e => {
      const buka = !!terbuka[e.nama];
      const stKelas = e.status === 'disetujui' ? 'disetujui'
                    : e.status === 'diajukan' ? 'diajukan' : 'belum';
      const stTeks = e.status === 'disetujui' ? 'Disetujui'
                   : e.status === 'diajukan' ? 'Menunggu Anda' : 'Belum mengisi';

      let kaki;
      if(e.status === 'belum'){
        kaki = '<span class="ket">Belum mengisi — rate ' + aman(data.labelLalu) +
          ' tetap berlaku, jadi tidak ada rute yang kosong.</span>' +
          (e.wa ? '<a class="btn-k putih" target="_blank" href="' + waIngat(e) +
                  '">Ingatkan via WA</a>' : '');
      } else if(e.status === 'diajukan'){
        kaki = '<span class="ket">Diajukan ' +
          (e.waktuAjukan ? new Date(e.waktuAjukan).toLocaleString('id-ID') : '-') +
          '. Periksa dulu, lalu setujui.</span>' +
          tautDok(e.nama, 'penawaran', 'Bukti penawaran', 'putih') +
          '<button class="btn-k hijau" onclick="setujui(\'' + aman(e.nama) + '\')">Setujui</button>';
      } else {
        kaki = '<span class="ket">Disetujui ' +
          (e.waktuSetuju ? new Date(e.waktuSetuju).toLocaleString('id-ID') : '-') + '.</span>' +
          tautDok(e.nama, 'penawaran', 'Bukti penawaran', 'putih') +
          tautDok(e.nama, 'kesepakatan', 'Cetak kesepakatan', '');
      }

      return '<div class="kartu-eks"><div class="ke-kop" onclick="togglePanel(\'' +
        aman(e.nama) + '\')">' +
        '<span class="ke-nm">' + aman(e.nama) + '</span>' +
        '<span class="ke-dok">' + e.jumlahRute + ' rute' +
          (e.noDokumen ? ' · ' + aman(e.noDokumen) : '') + '</span>' +
        (e.naik ? '<span class="hit-k naik">' + e.naik + ' naik</span>' : '') +
        (e.turun ? '<span class="hit-k turun">' + e.turun + ' turun</span>' : '') +
        (e.baru ? '<span class="hit-k baru">' + e.baru + ' baru</span>' : '') +
        '<span class="st-k ' + stKelas + '">' + stTeks + '</span>' +
        '<span style="color:var(--muted);font-size:14px;">' + (buka ? '▴' : '▾') + '</span></div>' +
        (buka ? '<div class="ke-badan">' + tabelRate(e) + '</div>' : '') +
        '<div class="ke-kaki">' + kaki + '</div></div>';
    }).join('');

  } else if(tabAktif === 'rute'){
    isi = panelRute();

  } else {
    const rute2 = (urutan && urutan.rute) || [];
    isi = rute2.length === 0
      ? '<div class="kartu-eks"><div class="ke-kaki"><span class="ket">Belum ada urutan — ' +
        'urutan terbentuk dari penawaran yang <b>sudah disetujui</b>.</span></div></div>'
      : rute2.map(r => '<div class="urut-rute"><div class="ur-kop">' +
          aman(r.kota) + ' · ' + aman(r.tipeMobil) + '</div>' +
          '<div class="gulir"><table class="k" style="min-width:460px;"><tbody>' +
          r.daftar.map(x => '<tr><td style="width:105px;"><span class="pil-u p' +
            Math.min(x.urutan,3) + '">' +
            (['PRIMARY','SECONDARY','TERTIARY'][x.urutan-1] || 'CADANGAN') + '</span></td>' +
            '<td style="font-weight:600;">' + aman(x.ekspedisi) + '</td>' +
            '<td class="kanan">' + rupiah(x.rate) + '</td>' +
            '<td class="kanan" style="color:var(--muted);">' +
            (x.selisih ? '+' + rupiah(x.selisih) : '—') + '</td></tr>').join('') +
          '</tbody></table></div></div>').join('');
  }

  document.getElementById('wadah').innerHTML = bar + isi;
}

function panelRute(){
  if(!rute) return '<div class="kartu-eks"><div class="ke-kaki"><span class="ket">Memuat…</span></div></div>';

  const ada = rute.daftar.length;
  const tabel = ada
    ? '<div class="gulir"><table class="k" style="min-width:520px;"><thead><tr>' +
      '<th style="width:38px;">#</th><th>Kota</th><th>Tipe</th><th>Distributor</th>' +
      '<th>Catatan</th></tr></thead><tbody>' +
      rute.daftar.map((r,i) => '<tr><td class="mono" style="color:var(--muted);">' + (i+1) + '</td>' +
        '<td class="mono"><b>' + aman(r.kota) + '</b></td>' +
        '<td class="mono">' + aman(r.tipeMobil) + '</td>' +
        '<td>' + aman(r.distributor || '') + '</td>' +
        '<td style="color:var(--muted);font-size:11.5px;">' + aman(r.catatan || '') + '</td></tr>').join('') +
      '</tbody></table></div>'
    : '<div style="padding:22px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;">' +
      'Belum ada daftar rute untuk ' + aman(rute.labelPeriode) + '.<br>' +
      'Selama kosong, tiap ekspedisi melihat rutenya sendiri berdasarkan riwayat.</div>';

  const contoh = rute.saran && rute.saran.length
    ? rute.saran.slice(0, 60).map(x => x.kota + '\t' + x.tipeMobil).join('\n')
    : 'DUMAI\t40 ft\nPALU\t40 ft\nTERNATE\t20 ft';

  return '<div class="kartu-eks">' +
    '<div class="ke-kop" style="cursor:default;">' +
      '<span class="ke-nm">Rute ' + aman(rute.labelPeriode) + '</span>' +
      '<span class="ke-dok">' + (ada ? ada + ' rute ditentukan' : 'belum ditentukan') + '</span>' +
    '</div>' +
    tabel +
    '<div class="ke-kaki" style="display:block;">' +
      '<div class="ket" style="margin-bottom:9px;">' +
        'Tempel daftar rute dari Excel — <b>dua kolom</b>: kota dan tipe. ' +
        'Boleh ditambah kolom ketiga (distributor) dan keempat (catatan).<br>' +
        'Daftar ini <b>mengganti seluruh daftar sebelumnya</b> untuk periode ini, dan ' +
        'dipakai semua ekspedisi.' +
      '</div>' +
      '<textarea id="tempel-rute" style="width:100%;min-height:130px;border:1px solid var(--line-tebal);' +
        'padding:11px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.6;" ' +
        'placeholder="' + aman(contoh.split('\n').slice(0,3).join(' | ')) + '">' + aman(ruteDraf) + '</textarea>' +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
        '<button class="btn-k" onclick="simpanRute()">Simpan daftar rute</button>' +
        (rute.saran && rute.saran.length
          ? '<button class="btn-k putih" onclick="isiDariRate()">Isi dari Template Rate (' +
            rute.saran.length + ' rute)</button>' : '') +
        (ada ? '<button class="btn-k putih" onclick="salinRute()">Salin daftar sekarang</button>' : '') +
      '</div>' +
    '</div></div>';
}

function isiDariRate(){
  if(!rute || !rute.saran) return;
  ruteDraf = rute.saran.map(x => x.kota + '\t' + x.tipeMobil).join('\n');
  render();
  setStatus(rute.saran.length + ' rute dari Template Rate dimuat — periksa dulu, lalu Simpan.');
}

function salinRute(){
  const t = rute.daftar.map(r => [r.kota, r.tipeMobil, r.distributor || '', r.catatan || '']
    .join('\t').replace(/\t+$/,'')).join('\n');
  navigator.clipboard.writeText(t)
    .then(() => setStatus('Daftar rute disalin.'))
    .catch(() => setStatus('Gagal menyalin.', true));
}

async function simpanRute(){
  const el = document.getElementById('tempel-rute');
  const teks = el ? el.value : '';
  ruteDraf = teks;

  const isi = [];
  teks.split(/\r?\n/).forEach(b => {
    if(!b.trim()) return;
    const k = b.split(/\t|;|\s{2,}|,/).map(x => x.trim()).filter(x => x !== '');
    if(k.length < 2) return;
    isi.push({ kota: k[0], tipeMobil: k[1], distributor: k[2] || '', catatan: k[3] || '' });
  });

  if(isi.length === 0){
    setStatus('Tidak ada baris yang terbaca. Tiap baris minimal: kota, lalu tipe.', true);
    return;
  }
  if(!confirm('Simpan ' + isi.length + ' rute untuk ' + rute.labelPeriode + '?\n\n' +
      'Daftar ini MENGGANTI seluruh daftar sebelumnya, dan jadi rute yang diisi ' +
      'semua ekspedisi bulan itu.')) return;

  try{
    setStatus('Menyimpan…');
    const r = await gas({action:'rb_rute_simpan', adminPass, periode: periodePilih,
                         data: JSON.stringify(isi)});
    ruteDraf = '';
    rute = await gas({action:'rb_rute_baca', adminPass, periode: periodePilih});
    render();
    setStatus(r.jumlah + ' rute tersimpan' +
      (r.dilewati ? ' · ' + r.dilewati + ' baris dilewati (kembar atau tidak lengkap)' : '') + '.');
  }catch(err){ setStatus('Gagal menyimpan: ' + err.message, true); }
}

function teksUndangan(nama){
  return [
    'Halo ' + (nama || '') + ',',
    'Mohon mengisi rate untuk periode *' + data.labelPeriode + '*.',
    'Rate ' + data.labelLalu + ' sudah tertera di halaman. Yang tidak berubah cukup dibiarkan — ' +
    'rate lama otomatis tetap berlaku. Kalau ada kenaikan, mohon sebutkan alasannya.',
    'Isi di sini:\nhttps://nanodoang.github.io/UNIFAM-lelang-expedisi/rate-bulanan.html',
    'Terima kasih.'
  ].join('\n\n');
}
function waIngat(e){
  return 'https://wa.me/' + String(e.wa).replace(/[^0-9]/g,'') +
         '?text=' + encodeURIComponent(teksUndangan(e.nama));
}
function salinUndangan(){
  const t = teksUndangan('');
  navigator.clipboard.writeText(t)
    .then(() => setStatus('Undangan disalin — tinggal tempel di grup WA.'))
    .catch(() => setStatus('Gagal menyalin.', true));
}

async function setujui(nama){
  const e = data.ekspedisi.find(x => x.nama === nama);
  if(!e) return;
  if(!confirm('Setujui penawaran ' + nama + ' untuk ' + data.labelPeriode + '?\n\n' +
      e.jumlahRute + ' rute — ' + e.naik + ' naik, ' + e.turun + ' turun, ' + e.baru + ' baru.\n\n' +
      'Setelah disetujui, ekspedisi TIDAK bisa mengubahnya lagi, dan rate ini jadi ' +
      'dasar penagihan sepanjang periode.')) return;
  try{
    setStatus('Menyetujui…');
    const r = await gas({action:'rb_setujui', adminPass, periode: periodePilih, ekspedisi: nama});
    await muat();
    setStatus(nama + ' disetujui. Nomor kesepakatan ' + r.noKesepakatan + ' — silakan dicetak.');
  }catch(err){ setStatus('Gagal menyetujui: ' + err.message, true); }
}

{
  periodePilih = daftarPeriode()[1];
  const simpanan = sessionStorage.getItem('lelang-admin-pass');
  if(simpanan){
    adminPass = simpanan;
    gas({action:'cek_admin', adminPass})
      .then(() => { document.getElementById('gerbang').style.display = 'none'; muat(); })
      .catch(() => { adminPass = ''; sessionStorage.removeItem('lelang-admin-pass'); });
  }
  setTimeout(() => { const i = document.getElementById('g-pass'); if(i) i.focus(); }, 60);
}

</script>
</body>
</html>
