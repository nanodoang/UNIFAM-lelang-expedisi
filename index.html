<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lelang Kiriman — UNIFAM</title>
<style>
:root{
  --sky-deep:#1E88E5; --sky:#3FA3F2; --sky-light:#EAF4FD;
  --panel:#FFFFFF; --line:#D8E9FB; --text:#14293D; --muted:#5C7896;
  --amber:#F2A93B; --teal:#0FA894; --red:#E1554D;
  --mono:'JetBrains Mono','Courier New',monospace;
  --sans:'Space Grotesk',Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,var(--sky-deep) 0%,var(--sky) 210px,var(--sky-light) 210px,var(--sky-light) 100%);
  color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:60px;}
header{max-width:1000px;margin:0 auto;padding:30px 22px 18px;color:#fff;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.75);text-transform:uppercase;margin-bottom:8px;}
h1{font-size:clamp(21px,5vw,27px);margin:0 0 6px;letter-spacing:-0.01em;}
.sub{color:rgba(255,255,255,.85);font-size:13.5px;max-width:520px;line-height:1.55;}
.baris-badge{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px;}
.eks-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:20px;font-family:var(--mono);font-size:12.5px;}
.btn-keluar{background:transparent;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.9);
  font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:20px;cursor:pointer;}
.btn-keluar:hover{background:rgba(255,255,255,.16);}
#status-bar{max-width:1000px;margin:0 auto 12px;padding:0 22px;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
#status-bar.err{color:var(--red);}
#status-bar.ok{color:var(--teal);}
main{max-width:1000px;margin:0 auto;padding:0 22px;}

/* ---------- masuk ---------- */
.kotak-masuk{max-width:360px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:22px 24px;box-shadow:0 4px 16px rgba(30,136,229,.12);}
.kotak-masuk h2{font-size:16px;margin:0 0 4px;}
.kotak-masuk p{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.55;}
label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
input,textarea{background:#fff;border:1.5px solid var(--line);color:var(--text);padding:10px 12px;
  border-radius:8px;font-size:13.5px;font-family:var(--mono);width:100%;}
input:focus,textarea:focus{outline:none;border-color:var(--sky-deep);}
input[type="date"]{min-height:42px;}
.kotak-masuk .kolom{margin-bottom:12px;}
.btn-utama{width:100%;background:var(--sky-deep);color:#fff;border:none;border-radius:8px;
  font-weight:700;font-size:14px;padding:12px;cursor:pointer;font-family:var(--sans);}
.btn-utama:hover{background:#1670BF;}
.btn-utama:disabled{opacity:.5;cursor:default;}
.pesan-salah{background:rgba(225,85,77,.1);border:1px solid rgba(225,85,77,.35);color:#B33B34;
  border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.5;}

/* ---------- tab ---------- */
.tab-baris{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;box-shadow:0 2px 8px rgba(30,136,229,.07);margin-bottom:16px;width:fit-content;}
.tab-baris button{background:transparent;border:none;padding:11px 22px;font-family:var(--sans);
  font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.tab-baris button.aktif{background:var(--sky-deep);color:#fff;}
.tab-baris button:not(.aktif):hover{background:#F4F9FE;color:var(--text);}

/* ---------- kartu lelang ---------- */
.grid{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,136,229,.08);}
.card-head{padding:16px 18px 10px;}
.route{font-size:15.5px;font-weight:700;}
.route .arrow{color:var(--sky-deep);margin:0 6px;}
.meta{font-size:12px;color:var(--muted);margin-top:5px;font-family:var(--mono);line-height:1.7;}
.alamat-box{margin-top:9px;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  background:#F4F9FE;border-left:3px solid var(--sky-deep);padding:7px 10px;border-radius:0 6px 6px 0;line-height:1.6;}
.alamat-box b{color:var(--text);font-weight:700;}
.deadline-tag{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--amber);
  background:rgba(242,169,59,.12);padding:3px 10px;border-radius:20px;}
.deadline-tag.lewat{color:var(--red);background:rgba(225,85,77,.1);}
.card-body{border-top:1px solid var(--line);padding:14px 18px 18px;background:#FBFDFF;}
.rate-patokan{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#EAF4FD;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:12px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);}
.rate-patokan b{color:var(--sky-deep);font-size:15px;}
.submitted-note{font-family:var(--mono);font-size:11.5px;color:var(--teal);margin-bottom:12px;line-height:1.7;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.form-grid .full{grid-column:1 / -1;}
.btn-ajukan{width:100%;background:var(--sky-deep);color:#fff;border:none;border-radius:8px;
  font-weight:700;font-size:13.5px;padding:11px 18px;cursor:pointer;margin-top:11px;font-family:var(--sans);}
.btn-ajukan:hover{background:#1670BF;}
.btn-ajukan:disabled{opacity:.5;cursor:default;}

/* ---------- tabel riwayat ---------- */
.kotak-tabel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,136,229,.07);}
.gulir{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px;}
thead th{text-align:left;font-family:var(--mono);font-size:9.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;padding:11px 12px;border-bottom:1.5px solid var(--line);background:#FBFDFF;white-space:nowrap;}
thead th.isi{color:var(--sky-deep);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
td.mono{font-family:var(--mono);white-space:nowrap;}
td.kanan{text-align:right;font-family:var(--mono);white-space:nowrap;}
td.tebal{font-weight:700;}
table input{padding:6px 8px;font-size:11.5px;min-width:118px;}
table input.ket{min-width:150px;font-family:var(--sans);}
.tak-ada{text-align:center;color:var(--muted);font-size:13px;padding:44px 20px;font-style:italic;}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;
  background:var(--panel);border:1px dashed var(--line);border-radius:14px;}
.ket-bawah{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7;}
footer{max-width:1000px;margin:30px auto 0;padding:16px 22px;color:#8FA7C2;font-size:11px;
  font-family:var(--mono);border-top:1px solid var(--line);line-height:1.7;}

.logo-unifam{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 7px;}
.baris-judul{display:flex;align-items:center;gap:13px;margin-bottom:6px;}
.baris-judul h1{margin:0;}

.tirai{position:fixed;inset:0;background:rgba(20,41,61,.55);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:90;}
.jendela{background:var(--panel);border-radius:14px;padding:22px 24px;max-width:360px;width:100%;
  box-shadow:0 10px 34px rgba(20,41,61,.3);}
.jendela h2{font-size:16px;margin:0 0 4px;}
.jendela p.ket{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.55;}
.jendela .kolom{margin-bottom:12px;}
.baris-tombol{display:flex;gap:9px;margin-top:4px;}
.btn-batal{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);color:var(--muted);
  border-radius:8px;font-weight:600;font-size:13px;padding:11px 18px;cursor:pointer;font-family:var(--sans);}
.btn-batal:hover{border-color:var(--sky-deep);color:var(--sky-deep);}

.card.terpilih{border-color:var(--sky-deep);box-shadow:0 2px 14px rgba(30,136,229,.2);}
.card-head.dengan-cek{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;}
.cek{width:21px;height:21px;accent-color:var(--sky-deep);cursor:pointer;margin-top:2px;flex-shrink:0;}
.bilah{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  box-shadow:0 -4px 20px rgba(20,41,61,.12);padding:13px 22px;z-index:60;}
.bilah-isi{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:13px;}
.bilah-teks{flex:1;font-size:13px;line-height:1.45;}
.bilah-teks b{display:block;font-size:14.5px;}
.bilah-teks small{color:var(--muted);font-family:var(--mono);font-size:11px;}
.btn-kirim{background:var(--sky-deep);color:#fff;border:none;border-radius:9px;font-weight:700;
  font-size:14px;padding:13px 22px;cursor:pointer;font-family:var(--sans);white-space:nowrap;}
.btn-kirim:hover{background:#1670BF;}
.btn-kirim:disabled{background:#C9DCF0;cursor:default;}
.pilih-semua{background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
  font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 13px;cursor:pointer;margin-bottom:12px;}
.pilih-semua:hover{border-color:var(--sky-deep);color:var(--sky-deep);}
.lapor{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.65;}
.lapor.baik{background:rgba(15,168,148,.1);border:1px solid rgba(15,168,148,.4);color:#0A7D6E;}
.lapor.buruk{background:#FDECEA;border:1px solid var(--red);color:#B33B34;}
body.ada-bilah{padding-bottom:100px;}
</style>
</head>
<body>

<header id="header"></header>
<div id="status-bar"></div>
<main id="isi"></main>
<footer id="kaki"></footer>

<script>
/* ====== GANTI URL INI kalau deployment Apps Script berubah ====== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';

const params = new URLSearchParams(window.location.search);
const ekspedisiDariLink = (params.get('ekspedisi') || '').toUpperCase();

let jsonpN = 0;
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'gascb' + (++jsonpN) + '_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { bersih(); reject(new Error('Timeout — server tidak merespons')); }, 25000);
    function bersih(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (d) => { bersih(); resolve(d); };
    s.src = url + '&callback=' + cb;
    s.onerror = () => { bersih(); reject(new Error('Gagal terhubung ke Apps Script')); };
    document.body.appendChild(s);
  });
}
async function gas(p){
  const q = Object.keys(p).map(k => encodeURIComponent(k)+'='+encodeURIComponent(p[k])).join('&');
  const url = GAS_URL + '?' + q;
  let d = null;
  try { const r = await fetch(url); if(r.ok) d = await r.json(); } catch(e){ d = null; }
  if(d === null) d = await jsonp(url);
  if(d && d.error) throw new Error(d.error);
  return d;
}

/* ---------- sesi ---------- */
const KUNCI = 'lelang-unifam-sesi';
function simpanSesi(user, pass){ try{ localStorage.setItem(KUNCI, JSON.stringify({user, pass})); }catch(e){} }
function ambilSesi(){ try{ return JSON.parse(localStorage.getItem(KUNCI) || 'null'); }catch(e){ return null; } }
function hapusSesi(){ try{ localStorage.removeItem(KUNCI); }catch(e){} }

let sesi = null, namaEkspedisi = '', tabAktif = 'terbuka';
let daftarTerbuka = [], daftarRiwayat = [], pesanSalah = '', belumKonfirmasi = 0;

function setStatus(teks, kelas){
  const el = document.getElementById('status-bar');
  el.textContent = teks || '';
  el.className = kelas || '';
}
function formatRupiah(n){ return "Rp " + Number(n).toLocaleString("id-ID"); }
function formatKarton(n){ return Number(n).toLocaleString("id-ID"); }
function formatCbm(n){ return Number(n).toLocaleString("id-ID",{minimumFractionDigits:1}); }
function formatJam(ts){
  const diff = ts - Date.now();
  if(diff <= 0) return "lewat batas";
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
  return h>0 ? `sisa ${h}j ${m}m` : `sisa ${m}m`;
}
function keISO(t){
  if(!t) return '';
  const s = String(t).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function keLokal(iso){
  if(!iso) return '';
  const m = String(iso).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso).trim();
}
function amanHTML(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- masuk & keluar ---------- */
async function masuk(){
  const user = document.getElementById('in-user').value.trim();
  const pass = document.getElementById('in-pass').value.trim();
  const btn = document.getElementById('btn-masuk');
  if(!user || !pass){ pesanSalah = 'User dan password harus diisi.'; render(); return; }
  try{
    btn.disabled = true;
    setStatus('Memeriksa…');
    const r = await gas({action:'login', user, pass});
    sesi = {user, pass};
    namaEkspedisi = r.ekspedisi;
    pesanSalah = '';
    simpanSesi(user, pass);
    await muat();
  }catch(err){
    pesanSalah = err.message;
    setStatus('');
    render();
  }
}
function keluar(){
  hapusSesi();
  sesi = null; namaEkspedisi = ''; daftarTerbuka = []; daftarRiwayat = [];
  setStatus('');
  render();
}

async function muat(){
  if(!sesi) { render(); return; }
  try{
    setStatus('Memuat data…');
    const d = await gas({action:'data_ekspedisi', user:sesi.user, pass:sesi.pass});
    namaEkspedisi = d.ekspedisi;
    daftarTerbuka = d.terbuka || [];
    daftarRiwayat = d.riwayat || [];
    belumKonfirmasi = d.belumKonfirmasi || 0;
    { const ada = new Set(daftarTerbuka.map(l => l.id));
      Array.from(terpilih).forEach(id => { if(!ada.has(id)) terpilih.delete(id); }); }
    setStatus(`Data terbaru · ${new Date().toLocaleTimeString('id-ID')}`);
    render();
  }catch(err){
    if(String(err.message).toLowerCase().includes('salah')){
      hapusSesi(); sesi = null;
      pesanSalah = 'Sesi tidak berlaku lagi, silakan masuk kembali.';
      setStatus('');
    } else {
      setStatus('Gagal memuat: ' + err.message, 'err');
    }
    render();
  }
}

function gantiTab(t){ tabAktif = t; render(); }

/* ---------- ganti password ---------- */
function bukaGantiPass(){
  const w = document.createElement('div');
  w.className = 'tirai';
  w.id = 'tirai-pass';
  w.innerHTML = `
    <div class="jendela">
      <h2>Ganti password</h2>
      <p class="ket">Masukkan password lama, lalu password baru minimal 6 karakter tanpa spasi.</p>
      <div id="pesan-pass"></div>
      <div class="kolom"><label>Password lama</label><input id="p-lama" type="password" placeholder="••••••••"></div>
      <div class="kolom"><label>Password baru</label><input id="p-baru" type="password" placeholder="minimal 6 karakter"></div>
      <div class="kolom"><label>Ulangi password baru</label><input id="p-ulang" type="password" placeholder="ketik ulang"
             onkeydown="if(event.key==='Enter')kirimGantiPass()"></div>
      <div class="baris-tombol">
        <button class="btn-utama" id="btn-ganti" onclick="kirimGantiPass()">Simpan</button>
        <button class="btn-batal" onclick="tutupGantiPass()">Batal</button>
      </div>
    </div>`;
  w.onclick = (ev) => { if(ev.target === w) tutupGantiPass(); };
  document.body.appendChild(w);
  document.getElementById('p-lama').focus();
}
function tutupGantiPass(){
  const w = document.getElementById('tirai-pass');
  if(w) w.remove();
}
function pesanPass(teks){
  const el = document.getElementById('pesan-pass');
  if(el) el.innerHTML = teks ? `<div class="pesan-salah">${amanHTML(teks)}</div>` : '';
}
async function kirimGantiPass(){
  const lama = document.getElementById('p-lama').value.trim();
  const baru = document.getElementById('p-baru').value.trim();
  const ulang = document.getElementById('p-ulang').value.trim();
  const btn = document.getElementById('btn-ganti');

  if(!lama || !baru){ pesanPass('Semua kolom harus diisi.'); return; }
  if(baru.length < 6){ pesanPass('Password baru minimal 6 karakter.'); return; }
  if(/\s/.test(baru)){ pesanPass('Password tidak boleh mengandung spasi.'); return; }
  if(baru !== ulang){ pesanPass('Password baru dan ulangannya tidak sama.'); return; }

  try{
    btn.disabled = true;
    pesanPass('');
    await gas({action:'ganti_password', user:sesi.user, pass:lama, passBaru:baru});
    sesi = {user:sesi.user, pass:baru};
    simpanSesi(sesi.user, baru);
    tutupGantiPass();
    setStatus('Password berhasil diganti.', 'ok');
  }catch(err){
    pesanPass(err.message);
    btn.disabled = false;
  }
}

/* ---------- ajukan penawaran (banyak sekaligus) ---------- */
const terpilih = new Set();
let laporan = null;

function togglePilih(id, nyala){
  if(nyala) terpilih.add(id); else terpilih.delete(id);
  const c = document.getElementById('card-' + id);
  if(c) c.classList.toggle('terpilih', nyala);
  perbaruiBilah();
}

/* Mengisi harga otomatis mencentang; harga dikosongkan melepas centang */
function isiHarga(id){
  const v = parseInt(document.getElementById('harga-' + id).value, 10);
  const nyala = !!v && v > 0;
  const cek = document.getElementById('cek-' + id);
  if(cek) cek.checked = nyala;
  togglePilih(id, nyala);
}

function pilihSemua(){
  daftarTerbuka.forEach(l => {
    const inp = document.getElementById('harga-' + l.id);
    if(!inp) return;
    const v = parseInt(inp.value, 10);
    if(v > 0){
      const cek = document.getElementById('cek-' + l.id);
      if(cek) cek.checked = true;
      togglePilih(l.id, true);
    }
  });
}

function perbaruiBilah(){
  const n = terpilih.size;
  const btn = document.getElementById('btn-kirim');
  const judul = document.getElementById('bilah-judul');
  const ket = document.getElementById('bilah-ket');
  if(!btn) return;

  btn.disabled = n === 0;
  btn.textContent = n > 1 ? `Ajukan ${n} Penawaran` : 'Ajukan Penawaran';

  if(n === 0){
    judul.textContent = 'Belum ada yang dipilih';
    ket.textContent = 'isi harga dulu untuk mengaktifkan';
  } else {
    let total = 0;
    terpilih.forEach(id => {
      const inp = document.getElementById('harga-' + id);
      total += (inp ? parseInt(inp.value, 10) : 0) || 0;
    });
    judul.textContent = `${n} lelang dipilih`;
    ket.textContent = 'total ' + formatRupiah(total);
  }
}

async function kirimTerpilih(){
  const daftar = Array.from(terpilih);
  if(daftar.length === 0) return;

  const btn = document.getElementById('btn-kirim');
  btn.disabled = true;

  const berhasil = [], gagal = [];
  for(let i = 0; i < daftar.length; i++){
    const id = daftar[i];
    const l = daftarTerbuka.find(x => x.id === id);
    const nama = l ? l.kota : id;
    const harga = parseInt(document.getElementById('harga-' + id).value, 10);

    if(!harga || harga <= 0){ gagal.push(`${nama} — harga belum diisi`); continue; }

    setStatus(`Mengirim ${i+1} dari ${daftar.length}…`);
    try{
      await gas({action:'bid_submit', user:sesi.user, pass:sesi.pass, idLelang:id, harga,
                 etd: keLokal(document.getElementById('etd-' + id).value),
                 eta: keLokal(document.getElementById('eta-' + id).value),
                 namaKapal: document.getElementById('kapal-' + id).value.trim()});
      berhasil.push(nama);
      terpilih.delete(id);
    }catch(err){
      gagal.push(`${nama} — ${err.message}`);
    }
  }

  laporan = { berhasil, gagal };
  setStatus('');
  await muat();     // yang gagal tetap tercentang, tinggal coba lagi
}

/* ---------- simpan realisasi ---------- */
let jedaSimpan = {};
function ubahRealisasi(id){
  clearTimeout(jedaSimpan[id]);
  jedaSimpan[id] = setTimeout(() => simpanRealisasi(id), 700);
}
async function simpanRealisasi(id){
  try{
    setStatus('Menyimpan…');
    await gas({action:'realisasi_submit', user:sesi.user, pass:sesi.pass, idLelang:id,
               atd: keLokal(document.getElementById(`atd-${id}`).value),
               ata: keLokal(document.getElementById(`ata-${id}`).value),
               dooring: keLokal(document.getElementById(`dooring-${id}`).value),
               keterangan: document.getElementById(`ket-${id}`).value.trim()});
    setStatus(`Tersimpan · ${new Date().toLocaleTimeString('id-ID')}`, 'ok');
  }catch(err){
    setStatus('Gagal menyimpan: ' + err.message, 'err');
  }
}

SbQ5g1jE7sW+orFjzfmj8JGYS3nEbxKyJQUdQBmIX6MkIQITzQKXmEZQ+TeTHiINb3qvWk692vChmaRRFJg39MsfI0pk1m+AddMV30OYuPR1FDGI25yKvvvvSUtMGlRH/OmGWGkuNUuMEaiNaYxY7qt9fbfdyNA9XwxjSvQ0FqQXoO/1NiibUamVli3eQr8iaO369tWNPAzk0Pd1ukokjaZnriibUGGVbMJhQ+hfPD6mWpPsBWL11e4EuNNazpv+42T3tt/raUsDkSZ8iVY4fYm4h4lrZycCca3C0/FjMDg79/LjeOcTzF5nJDhH6SF/mFA4eGJf5ES06TLsY57uepy51qXYMVZ++Rx0Jc8Vczd0DRtcKdzSGdrEv7uITeCKG4BXqYvNjyneuxfjUyOfdGP1TwzVCxjkrfA81j98eVq9dRQ7ORM/qGAEQix/i754AXldcj5EnjFE7zQk2aqmC1p34lz2KxHn6vmALJBMZHyXkjbe5cWkFxn5hqJC6Ktq8xXQvxX1TQTAVuYgDnc81bZY3HRiTuzhLswjoIAei+vMcY3oH9DVmHfRcVKv6XRJfDX9byoyhYHheRuxouPqN/jaPGeAAxa/GT3qEGtC9EvF2yX//QP6b3qmBWc62CDxID4eN7wjHrqZch+yuoQF1bCwpHBFyzy1XOw+QrD3B6nkQ4847oF+rjgGe5QSNarwh5B+JBVRTHu1wTHzGnpCc6xUS6SXltYU6avGaUn9rzbb2aHenoRM2ukWPxM1u0L8XYKDIhRdIM3uT6rw2pxjTIoXPOkRnuRKRhstGuYyJc0AcTTdBe1aKz9dmZD/HhwE1NG7VS7Vkh5LNuudtRIyMSAAAA" alt="UNIFAM"><div>
      <div class="eyebrow">PT. UNIFAM · Lelang Kiriman</div>
      <h1>Panel Ekspedisi</h1>
    </div></div>
    <p class="sub">Isi penawaran untuk lelang yang terbuka, dan lengkapi realisasi pengiriman di riwayat.</p>
    <div class="baris-badge">
      <span class="eks-badge">🚚 ${amanHTML(namaEkspedisi)}</span>
      <button class="btn-keluar" onclick="bukaGantiPass()">Ganti password</button>
      <button class="btn-keluar" onclick="keluar()">Keluar</button>
    </div>`;

  const tabHTML = `
    <div class="tab-baris">
      <button class="${tabAktif==='terbuka'?'aktif':''}" onclick="gantiTab('terbuka')">Lelang terbuka (${daftarTerbuka.length})</button>
      <button class="${tabAktif==='riwayat'?'aktif':''}" onclick="gantiTab('riwayat')">Riwayat dipakai (${daftarRiwayat.length})</button>
    </div>`;

  isi.innerHTML = tabHTML + (tabAktif === 'terbuka' ? kartuTerbuka() : tabelRiwayat());

  const bilahLama = document.getElementById('bilah');
  if(bilahLama) bilahLama.remove();
  document.body.classList.remove('ada-bilah');

  if(tabAktif === 'terbuka' && daftarTerbuka.length > 0){
    const bar = document.createElement('div');
    bar.className = 'bilah';
    bar.id = 'bilah';
    bar.innerHTML = `
      <div class="bilah-isi">
        <div class="bilah-teks">
          <b id="bilah-judul">Belum ada yang dipilih</b>
          <small id="bilah-ket">isi harga dulu untuk mengaktifkan</small>
        </div>
        <button class="btn-kirim" id="btn-kirim" onclick="kirimTerpilih()" disabled>Ajukan</button>
      </div>`;
    document.body.appendChild(bar);
    document.body.classList.add('ada-bilah');
    perbaruiBilah();
  }
  kaki.textContent = tabAktif === 'terbuka'
    ? 'Harga yang Anda ajukan tidak terlihat oleh ekspedisi lain.'
    : 'Kolom ATD, ATA, Dooring, dan Keterangan diisi oleh Anda. Tersimpan otomatis beberapa saat setelah diisi.';
}

function kartuTerbuka(){
  if(daftarTerbuka.length === 0){
    return `<div class="empty-state">Belum ada lelang terbuka saat ini. Cek lagi nanti ya.</div>`;
  }

  const lap = laporan ? kotakLaporan() : '';
  laporan = null;

  const kartu = daftarTerbuka.map(l => {
    const b = l.bidSaya;
    const lewat = l.batasWaktu - Date.now() <= 0;
    const dipilih = terpilih.has(l.id);
    return `<div class="card ${dipilih ? 'terpilih' : ''}" id="card-${l.id}">
      <div class="card-head dengan-cek">
        <input type="checkbox" class="cek" id="cek-${l.id}" ${dipilih ? 'checked' : ''}
               onchange="togglePilih('${l.id}', this.checked)" title="pilih untuk diajukan">
        <div>
          <div class="route">Cikande<span class="arrow">→</span>${amanHTML(l.kota)}</div>
          <div class="meta">${amanHTML(l.customer)}<br>${amanHTML(l.tipeMobil)} · ${formatKarton(l.karton)} karton · ${formatCbm(l.cbm)} CBM · ${amanHTML(l.tanggal)}</div>
          ${l.alamat ? `<div class="alamat-box"><b>Alamat:</b> ${amanHTML(l.alamat)}</div>` : ''}
          <div class="deadline-tag ${lewat?'lewat':''}">${formatJam(l.batasWaktu)}</div>
        </div>
      </div>
      <div class="card-body">
        ${l.rateExisting ? `<div class="rate-patokan">Rate patokan UNIFAM<b>${formatRupiah(l.rateExisting)}</b></div>` : ''}
        ${b ? `<div class="submitted-note">✓ Penawaran Anda: ${formatRupiah(b.harga)}<br>ETD ${amanHTML(b.etd)||'-'} · ETA ${amanHTML(b.eta)||'-'} · Kapal ${amanHTML(b.namaKapal)||'-'}</div>` : ''}
        <div class="form-grid">
          <div class="full">
            <label>Harga Penawaran (Rp)</label>
            <input id="harga-${l.id}" type="number" inputmode="numeric" placeholder="0"
                   value="${b ? b.harga : ''}" oninput="isiHarga('${l.id}')">
          </div>
          <div><label>ETD</label><input id="etd-${l.id}" type="date" value="${keISO(b ? b.etd : '')}"></div>
          <div><label>ETA</label><input id="eta-${l.id}" type="date" value="${keISO(b ? b.eta : '')}"></div>
          <div class="full">
            <label>Nama Kapal</label>
            <input id="kapal-${l.id}" type="text" placeholder="mis. KM Meratus" value="${amanHTML(b ? b.namaKapal : '')}">
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  return lap +
    `<button class="pilih-semua" onclick="pilihSemua()">Centang semua yang sudah ada harganya</button>` +
    `<div class="grid">${kartu}</div>`;
}

function kotakLaporan(){
  const { berhasil, gagal } = laporan;
  let html = '';
  if(berhasil.length){
    html += `<div class="lapor baik"><b>${berhasil.length} penawaran terkirim</b><br>${berhasil.map(amanHTML).join(' · ')}</div>`;
  }
  if(gagal.length){
    html += `<div class="lapor buruk"><b>${gagal.length} gagal terkirim — masih tercentang, tinggal coba lagi</b><br>• ${gagal.map(amanHTML).join('<br>• ')}</div>`;
  }
  return html;
}

function tabelRiwayat(){
  if(daftarRiwayat.length === 0){
    return belumKonfirmasi > 0
      ? `<div class="empty-state">Ada ${belumKonfirmasi} pengiriman yang Anda menangkan, tapi belum muncul di sini karena form konfirmasi armadanya belum diisi.<br><br>Silakan buka link konfirmasi yang dikirim admin lewat WhatsApp terlebih dahulu.</div>`
      : `<div class="empty-state">Belum ada pengiriman yang dimenangkan.</div>`;
  }
  const baris = daftarRiwayat.map(r => `<tr>
    <td class="mono">${amanHTML(r.tanggalMuat)||'—'}</td>
    <td class="tebal">${amanHTML(r.customer)}</td>
    <td class="mono">${amanHTML(r.kota)}</td>
    <td class="kanan">${r.rate ? formatRupiah(r.rate) : '—'}</td>
    <td class="mono">${amanHTML(r.noKontener)||'—'}</td>
    <td>${amanHTML(r.namaKapal)||'—'}</td>
    <td class="mono">${amanHTML(r.etd)||'—'}</td>
    <td class="mono">${amanHTML(r.eta)||'—'}</td>
    <td><input id="atd-${r.id}" type="date" value="${keISO(r.atd)}" onchange="ubahRealisasi('${r.id}')"></td>
    <td><input id="ata-${r.id}" type="date" value="${keISO(r.ata)}" onchange="ubahRealisasi('${r.id}')"></td>
    <td><input id="dooring-${r.id}" type="date" value="${keISO(r.dooring)}" onchange="ubahRealisasi('${r.id}')"></td>
    <td><input id="ket-${r.id}" class="ket" type="text" placeholder="catatan…" value="${amanHTML(r.keterangan)}" oninput="ubahRealisasi('${r.id}')"></td>
  </tr>`).join('');

  const belum = daftarRiwayat.filter(r => !r.ata || !r.dooring).length;
  const catatan = belumKonfirmasi > 0
    ? ` · ${belumKonfirmasi} pengiriman menunggu form konfirmasi diisi`
    : '';
  return `<div class="kotak-tabel"><div class="gulir">
    <table>
      <thead><tr>
        <th>Tgl Muat</th><th>Distributor</th><th>Kota</th><th>Rate</th>
        <th>No Kontener</th><th>Kapal</th><th>ETD</th><th>ETA</th>
        <th class="isi">ATD</th><th class="isi">ATA</th><th class="isi">Dooring</th><th class="isi">Keterangan</th>
      </tr></thead>
      <tbody>${baris}</tbody>
    </table>
  </div></div>
  <div class="ket-bawah">${daftarRiwayat.length} pengiriman · ${belum} belum lengkap ATA / Dooring${catatan}</div>`;
}

/* ---------- mulai ---------- */
sesi = ambilSesi();

/* Kalau link menyebut ekspedisi lain daripada yang sedang masuk,
   sesi lama dibuang — supaya tiap link membuka ekspedisinya sendiri. */
if(sesi && ekspedisiDariLink &&
   String(sesi.user).trim().toUpperCase() !== ekspedisiDariLink){
  hapusSesi();
  sesi = null;
}

if(sesi){ muat(); } else { render(); }
setInterval(() => { if(sesi && tabAktif === 'terbuka') muat(); }, 90000);
</script>
</body>
</html>
