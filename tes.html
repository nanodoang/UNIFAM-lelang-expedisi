<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Koneksi — Lelang UNIFAM</title>
<style>
body{font-family:Arial,sans-serif;background:#EAF4FD;color:#14293D;margin:0;padding:24px;}
.box{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 10px rgba(30,136,229,.1);}
h1{font-size:20px;margin:0 0 4px;}
.sub{color:#5C7896;font-size:13px;margin-bottom:18px;}
.baris{padding:11px 0;border-bottom:1px solid #D8E9FB;font-size:13.5px;line-height:1.6;}
.baris:last-child{border-bottom:none;}
.label{font-weight:700;display:block;margin-bottom:3px;}
.val{font-family:'Courier New',monospace;font-size:12px;word-break:break-all;}
.ok{color:#0FA894;font-weight:700;}
.bad{color:#E1554D;font-weight:700;}
.wait{color:#F2A93B;font-weight:700;}
</style>
</head>
<body>
<div class="box">
  <h1>Tes Koneksi Apps Script</h1>
  <div class="sub">Menguji 2 metode. Cukup salah satu BERHASIL, aplikasi akan jalan. Screenshot lalu kirim ke chat.</div>

  <div class="baris"><span class="label">Halaman dibuka dari</span><span class="val" id="asal"></span></div>
  <div class="baris"><span class="label">METODE A — fetch GET</span><span class="val" id="hasilA"><span class="wait">menunggu…</span></span></div>
  <div class="baris"><span class="label">METODE B — JSONP</span><span class="val" id="hasilB"><span class="wait">menunggu…</span></span></div>
  <div class="baris"><span class="label">Data yang diterima</span><span class="val" id="data">—</span></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';
const URL_DASAR = GAS_URL + '?action=ambil_semua';

document.getElementById('asal').textContent = window.location.href;
const elA = document.getElementById('hasilA');
const elB = document.getElementById('hasilB');
const elD = document.getElementById('data');

/* METODE A */
(async function(){
  try{
    const r = await fetch(URL_DASAR);
    if(!r.ok){ elA.innerHTML = '<span class="bad">GAGAL</span> — status HTTP ' + r.status; return; }
    const d = await r.json();
    elA.innerHTML = '<span class="ok">BERHASIL</span>';
    elD.textContent = JSON.stringify(d);
  }catch(err){
    elA.innerHTML = '<span class="bad">GAGAL</span> — ' + err.message;
  }
})();

/* METODE B */
const cb = 'tescb' + Date.now();
const t = setTimeout(() => {
  elB.innerHTML = '<span class="bad">TIMEOUT</span> — script termuat tapi callback tidak dipanggil';
}, 25000);
window[cb] = function(d){
  clearTimeout(t);
  elB.innerHTML = '<span class="ok">BERHASIL</span>';
  if(elD.textContent === '—') elD.textContent = JSON.stringify(d);
};
const s = document.createElement('script');
s.src = URL_DASAR + '&callback=' + cb;
s.onerror = function(){
  clearTimeout(t);
  elB.innerHTML = '<span class="bad">ONERROR</span> — browser memblokir pemuatan script';
};
document.body.appendChild(s);
</script>
</body>
</html>
