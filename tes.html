<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Koneksi — Lelang UNIFAM</title>
<style>
body{font-family:Arial,sans-serif;background:#EAF4FD;color:#14293D;margin:0;padding:24px;}
.box{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 10px rgba(30,136,229,.1);}
h1{font-size:20px;margin:0 0 4px;}
.sub{color:#5C7896;font-size:13px;margin-bottom:18px;}
.baris{padding:11px 0;border-bottom:1px solid #D8E9FB;font-size:13.5px;line-height:1.6;}
.baris:last-child{border-bottom:none;}
.label{font-weight:700;display:block;margin-bottom:3px;}
.val{font-family:'Courier New',monospace;font-size:12px;word-break:break-all;color:#14293D;}
.ok{color:#0FA894;font-weight:700;}
.bad{color:#E1554D;font-weight:700;}
.wait{color:#F2A93B;font-weight:700;}
</style>
</head>
<body>
<div class="box">
  <h1>Tes Koneksi Apps Script</h1>
  <div class="sub">Halaman ini cuma untuk mendiagnosa. Screenshot seluruh isinya lalu kirim ke chat.</div>

  <div class="baris"><span class="label">1. Halaman ini dibuka dari</span><span class="val" id="asal"></span></div>
  <div class="baris"><span class="label">2. Protokol</span><span class="val" id="proto"></span></div>
  <div class="baris"><span class="label">3. URL yang dipanggil</span><span class="val" id="urlpanggil"></span></div>
  <div class="baris"><span class="label">4. Hasil</span><span class="val" id="hasil"><span class="wait">menunggu…</span></span></div>
  <div class="baris"><span class="label">5. Data yang diterima</span><span class="val" id="data">—</span></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';

document.getElementById('asal').textContent = window.location.href;
document.getElementById('proto').textContent = window.location.protocol +
  (window.location.protocol === 'file:' ? '  ← dibuka sebagai file lokal, bukan dari web' : '  (normal)');

const cb = 'tescb' + Date.now();
const src = GAS_URL + '?action=ambil_semua&callback=' + cb;
document.getElementById('urlpanggil').textContent = src;

const elHasil = document.getElementById('hasil');
const elData  = document.getElementById('data');

const timer = setTimeout(() => {
  elHasil.innerHTML = '<span class="bad">TIMEOUT</span> — script termuat tapi callback tidak pernah dipanggil (25 detik)';
}, 25000);

window[cb] = function(d){
  clearTimeout(timer);
  elHasil.innerHTML = '<span class="ok">BERHASIL</span> — callback terpanggil';
  elData.textContent = JSON.stringify(d);
};

const s = document.createElement('script');
s.src = src;
s.onerror = function(){
  clearTimeout(timer);
  elHasil.innerHTML = '<span class="bad">ONERROR</span> — browser gagal memuat script (diblokir, 404, atau ditolak)';
};
document.body.appendChild(s);
</script>
</body>
</html>
