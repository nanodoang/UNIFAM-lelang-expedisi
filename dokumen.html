<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kesepakatan Rate — UNIFAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#2A3180; --teal:#1596A3; --teal-tua:#0E7A85;
  --kertas:#EFF2F7; --tinta:#12172B; --muted:#5A6480;
  --line:#DDE2EC; --line-tebal:#C3CAD9;
  --amber:#D9820F; --red:#C8443A; --hijau:#12876B;
  --disp:'Barlow Condensed',Arial,sans-serif;
  --sans:'Barlow',Arial,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--kertas);color:var(--tinta);font-family:var(--sans);font-size:14px;}
.bar{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;
  gap:11px;flex-wrap:wrap;}
.bar .jd{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.05em;
  text-transform:uppercase;flex:1;}
.bar button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;padding:8px 14px;cursor:pointer;}
.bar button:hover{background:rgba(255,255,255,.3);}
.bar .status{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.75);width:100%;}
.bar .status.err{color:#FFC9C4;}
.luar{padding:22px;display:flex;justify-content:center;}

.lembar{background:#fff;width:210mm;min-height:297mm;padding:16mm 15mm 14mm;
  box-shadow:0 2px 14px rgba(18,23,43,.13);display:flex;flex-direction:column;}
.kop{display:flex;align-items:flex-start;gap:14px;padding-bottom:11px;
  border-bottom:2.5px solid var(--navy);}
.kop img{width:52px;height:52px;object-fit:contain;flex-shrink:0;}
.kop .pt{flex:1;}
.kop .nm{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.04em;
  text-transform:uppercase;line-height:1;color:var(--navy);}
.kop .un{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
.kop .kanan{text-align:right;font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.7;}
.garis-tipis{height:2px;background:var(--teal);margin-bottom:15px;}

.jd-dok{text-align:center;margin:14px 0 16px;}
.jd-dok h1{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.09em;
  text-transform:uppercase;margin:0;line-height:1.15;}
.jd-dok .no{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6;}
.jd-dok .cap{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
  padding:3px 10px;margin-top:8px;background:rgba(18,135,107,.13);color:#0B6350;
  border:1px solid rgba(18,135,107,.5);}

.pihak{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-tebal);margin-bottom:15px;}
.pihak > div{padding:10px 13px;}
.pihak > div:first-child{border-right:1px solid var(--line-tebal);}
.pihak .l{font-family:var(--disp);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;}
.pihak b{display:block;font-size:14px;margin-top:3px;line-height:1.25;}
.pihak span{color:var(--muted);font-size:11.5px;line-height:1.5;display:block;margin-top:2px;}

table{width:100%;border-collapse:collapse;font-size:11.5px;}
thead th{font-family:var(--disp);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#fff;background:var(--navy);text-align:left;padding:8px 9px;font-weight:600;}
thead th.kanan{text-align:right;}
tbody td{padding:7px 9px;border-bottom:1px solid var(--line);}
tbody tr:nth-child(even) td{background:#FAFBFD;}
tbody tr:last-child td{border-bottom:1.5px solid var(--navy);}
td.mono{font-family:var(--mono);white-space:nowrap;}
td.kanan{text-align:right;font-family:var(--mono);white-space:nowrap;}
td.no{color:var(--muted);font-family:var(--mono);width:26px;}
.alm{font-size:10px;color:var(--muted);line-height:1.4;display:block;margin-top:1px;}
tfoot td{padding:9px;font-family:var(--disp);font-weight:700;font-size:12.5px;
  letter-spacing:.05em;text-transform:uppercase;background:#F1F3F7;}
tfoot td.kanan{text-align:right;font-family:var(--mono);font-size:13px;letter-spacing:0;}

.syarat{margin-top:14px;border-left:2.5px solid var(--teal);padding:2px 0 2px 12px;
  font-size:10.5px;color:var(--muted);line-height:1.75;}
.syarat b{color:var(--tinta);}
.syarat ol{margin:0;padding-left:15px;}
.syarat li{margin-bottom:4px;}

.ttd{margin-top:auto;padding-top:26px;}
.ttd .tempat{text-align:right;font-size:11.5px;color:var(--muted);margin-bottom:12px;}
.ttd .kotak{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.ttd .kotak > div{text-align:center;font-size:11.5px;}
.ttd .peran{font-family:var(--disp);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:2px;}
.ttd .pt-nm{font-weight:600;font-size:12.5px;margin-bottom:56px;line-height:1.3;}
.ttd .garis{border-bottom:1px solid var(--tinta);margin-bottom:5px;}
.ttd .jb{color:var(--muted);font-size:10.5px;}
.ttd .cap-ttd{font-size:9.5px;color:var(--muted);font-style:italic;margin-top:2px;}

.kaki{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:8.5px;color:var(--muted);line-height:1.5;}
.pesan{padding:40px 26px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8;}
.pesan b{color:var(--tinta);}

@media print{
  body{background:#fff;}
  .bar{display:none;}
  .luar{padding:0;}
  .lembar{width:auto;min-height:auto;box-shadow:none;padding:0;}
  @page{size:A4;margin:14mm 13mm;}
  tbody tr{page-break-inside:avoid;}
  .ttd{page-break-inside:avoid;}
}
</style>
</head>
<body>

<div class="bar">
  <span class="jd">Kesepakatan Rate</span>
  <button onclick="window.print()">Cetak / PDF</button>
  <span class="status" id="status-bar"></span>
</div>

<div class="luar" id="luar"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';

let jsonpN = 0;
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'gascb' + (++jsonpN) + '_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { bersih(); reject(new Error('Timeout — server terlalu lama merespons. Coba muat ulang halaman.')); }, 60000);
    function bersih(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (d) => { bersih(); resolve(d); };
    s.src = url + '&callback=' + cb;
    s.onerror = () => { bersih(); reject(new Error('Gagal terhubung ke Apps Script')); };
    document.body.appendChild(s);
  });
}
async function gas(p){
  return kirimKeServer(p);
}

/* Jalur utama fetch; JSONP hanya cadangan. Kalau keduanya gagal,
   sebab dari jalur utama yang dilaporkan — bukan sekadar "timeout". */
async function kirimKeServer(params){
  const q = Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const url = GAS_URL + '?' + q;

  let sebabUtama = '';
  try {
    const r = await fetch(url);
    if(!r.ok) {
      sebabUtama = 'server menjawab ' + r.status + ' ' + r.statusText;
    } else {
      const teks = await r.text();
      if(/^\s*<(!DOCTYPE|html)/i.test(teks)){
        throw new Error('Server mengembalikan halaman web, bukan data. Biasanya berarti deployment Apps Script perlu diatur ulang ke "Who has access: Anyone".');
      }
      let d;
      try { d = JSON.parse(teks); }
      catch(e){ throw new Error('Jawaban server tidak terbaca: ' + teks.slice(0, 120)); }
      if(d && d.error) throw new Error(d.error);
      return d;
    }
  } catch(e){
    if(!sebabUtama) sebabUtama = e.message;
    // error dari server sendiri tidak perlu diulang lewat jalur cadangan
    if(/password|action tidak dikenal|tidak ditemukan|halaman web|tidak terbaca/i.test(sebabUtama)){
      throw new Error(sebabUtama);
    }
  }

  try {
    const d = await jsonp(url);
    if(d && d.error) throw new Error(d.error);
    return d;
  } catch(e2){
    throw new Error(sebabUtama || e2.message);
  }
}

let semuaBaris = [], tipeDarat = [], tipeLaut = [], jenisAktif = 'darat', infoLeadtim = {};

function setStatus(teks, error){
  const el = document.getElementById('status-bar');
  el.textContent = teks;
  el.className = error ? 'err' : '';
}

const par = new URLSearchParams(location.search);
const periode = par.get('periode') || '';
const namaEks = par.get('ekspedisi') || '';
let d = null;

function aman(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function rupiah(n){ return Number(n || 0).toLocaleString('id-ID'); }

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni',
               'Juli','Agustus','September','Oktober','November','Desember'];
function tglPanjang(ms){
  if(!ms) return '';
  const t = new Date(ms);
  return t.getDate() + ' ' + BULAN[t.getMonth()] + ' ' + t.getFullYear();
}
function tglPendek(ms){
  const t = ms ? new Date(ms) : new Date();
  const p = n => String(n).padStart(2,'0');
  return p(t.getDate()) + '/' + p(t.getMonth()+1) + '/' + t.getFullYear();
}
function akhirBulan(p){
  const b = String(p).split('-');
  return new Date(Number(b[0]), Number(b[1]), 0).getDate();
}

async function muat(){
  if(!periode || !namaEks){
    document.getElementById('luar').innerHTML =
      '<div class="lembar"><div class="pesan">Alamat halaman tidak lengkap.<br>' +
      'Buka lewat panel <b>Kesepakatan Rate</b>.</div></div>';
    return;
  }
  try{
    setStatus('Memuat dokumen…');
    d = await gas({action:'rb_dokumen', periode, ekspedisi: namaEks});
    setStatus(d.labelPeriode + ' · ' + d.ekspedisi + ' · ' + d.baris.length + ' rute');
    render();
  }catch(err){
    setStatus('Gagal memuat: ' + err.message, true);
    document.getElementById('luar').innerHTML =
      '<div class="lembar"><div class="pesan">Tidak bisa memuat dokumen.<br>' +
      aman(err.message) + '</div></div>';
  }
}

function render(){
  if(d.status !== 'disetujui'){
    document.getElementById('luar').innerHTML =
      '<div class="lembar"><div class="pesan">Penawaran ini <b>belum disetujui</b>, ' +
      'jadi lembar kesepakatannya belum bisa dicetak.<br><br>' +
      'Setujui dulu di panel <b>Kesepakatan Rate</b>.</div></div>';
    return;
  }

  let total = 0;
  const baris = d.baris.map((b, i) => {
    total += Number(b.rateDiajukan) || 0;
    const ket = [b.distributor, b.alamat].filter(x => x).join(' · ');
    return '<tr><td class="no">' + (i+1) + '</td>' +
      '<td><b>' + aman(b.kota) + '</b>' +
        (ket ? '<span class="alm">' + aman(ket) + '</span>' : '') + '</td>' +
      '<td class="mono">' + aman(b.tipeMobil) + '</td>' +
      '<td class="kanan">Rp ' + rupiah(b.rateDiajukan) + '</td></tr>';
  }).join('');

  const namaPihak2 = d.namaLengkap || d.ekspedisi;

  document.getElementById('luar').innerHTML =
  '<div class="lembar">' +
    '<div class="kop">' +
