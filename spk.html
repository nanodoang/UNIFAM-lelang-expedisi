<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Perintah Kirim — UNIFAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#2A3180;--teal:#1596A3;--teal-tua:#0E7A85;--ink:#1B2140;--muted:#66708A;--line:#D7DCE8;--bg:#EEF1F6;--red:#C8443C;--amber:#D9820F;
  --disp:'Barlow Condensed',Arial,sans-serif;--sans:'Barlow',Arial,sans-serif;--mono:'IBM Plex Mono',monospace;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:0 16px 50px}
.alat{max-width:794px;margin:0 auto;padding:14px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alat button.sekunder{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.alat button:disabled{opacity:.5;cursor:default}
.alat button{font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:15px;border:none;background:var(--navy);color:#fff;padding:10px 18px;cursor:pointer}
#status{font-family:var(--mono);font-size:12px;color:var(--muted)}
#status.err{color:var(--red)}
.kertas{background:#fff;max-width:794px;margin:0 auto;padding:44px 52px 40px;box-shadow:0 6px 28px rgba(27,33,64,.12);position:relative;overflow:hidden}
.kop{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:14px}
.kop img{width:58px;height:auto}
.kop .pt{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--navy);letter-spacing:.02em}
.kop .al{font-size:11.5px;color:var(--muted);line-height:1.5}
.kop .kanan{margin-left:auto;text-align:right}
.kop .jenis{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--teal)}
.kop .nomor{font-family:var(--mono);font-size:12.5px;margin-top:3px}
h2{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.06em;text-align:center;margin:22px 0 2px;color:var(--navy)}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
.info td{padding:5px 0;vertical-align:top}
.info td:first-child{width:170px;color:var(--muted)}
.m{font-family:var(--mono)}
.bagian{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--navy);padding:5px 10px;margin:20px 0 0}
.tabel th{background:#F2F4FA;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.06em;text-align:left;padding:7px 9px;border:1px solid var(--line)}
.tabel td{padding:8px 9px;border:1px solid var(--line);vertical-align:top}
.tabel td.r,.tabel th.r{text-align:right}
.tabel td.r{font-family:var(--mono);white-space:nowrap}
.tabel tr.final td{background:rgba(21,150,163,.08);font-weight:700}
.tabel tr.final td.r{font-size:15px;color:var(--navy)}
.syarat{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.6}
.ttd{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.ttd .kotak{border:1px solid var(--line);padding:12px 14px;font-size:12.5px;line-height:1.6;min-height:112px}
.ttd .siapa{font-family:var(--disp);font-weight:700;letter-spacing:.12em;font-size:11.5px;color:var(--muted);text-transform:uppercase}
.stempel{display:inline-block;border:2px solid var(--teal);color:var(--teal);font-family:var(--disp);font-weight:700;letter-spacing:.12em;padding:4px 10px;margin:8px 0 6px;transform:rotate(-3deg);font-size:13px}
.stempel.belum{border-color:var(--red);color:var(--red)}
.catatan-merah{font-size:12px;color:var(--red);line-height:1.5}
.kaki{margin-top:20px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:10.5px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.watermark{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-family:var(--disp);font-weight:700;font-size:120px;letter-spacing:.2em;color:rgba(42,49,128,.04);pointer-events:none}
.kosong{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:640px){.kertas{padding:24px 16px}.kop{flex-wrap:wrap}.kop .kanan{margin-left:0;text-align:left;width:100%}
  .ttd{grid-template-columns:1fr}.info td:first-child{width:118px}h2{font-size:18px}}
/* salinan untuk Download PDF selalu memakai tata letak A4, bukan versi HP */
.kertas.mode-pdf{padding:44px 52px 40px!important}
.kertas.mode-pdf .kop{flex-wrap:nowrap!important}
.kertas.mode-pdf .kop .kanan{margin-left:auto!important;text-align:right!important;width:auto!important}
.kertas.mode-pdf .ttd{grid-template-columns:1fr 1fr!important}
.kertas.mode-pdf .info td:first-child{width:170px!important}
.kertas.mode-pdf h2{font-size:21px!important}
@media print{
  body{background:#fff;padding:0}
  .alat{display:none}
  .kertas{box-shadow:none;max-width:none;padding:0}
  @page{size:A4;margin:14mm 13mm;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
/* ====== GANTI URL INI kalau deployment Apps Script berubah ====== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3NTsaRctj_PsQogkamjw0uyYHcbeN4WnO3Fpo1Hrz33aSBPLh400RZx_UEX6byhgU/exec';

const params = new URLSearchParams(window.location.search);
const idOrder  = params.get('order') || '';
const idLelang = params.get('id') || '';       // link lama tetap dilayani
const noManual = params.get('no') || '';       // v111: order manual (Pesanan Armada)
const namaEkspedisi = (params.get('ekspedisi') || '').toUpperCase();

let jsonpN = 0;
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'gascb' + (++jsonpN) + '_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { bersih(); reject(new Error('Timeout — server terlalu lama merespons. Coba muat ulang halaman.')); }, 60000);
    function bersih(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (d) => { bersih(); resolve(d); };
    s.src = url + '&callback=' + cb;
    s.onerror = () => { bersih(); reject(new Error('Gagal terhubung ke Apps Script')); };
    document.body.appendChild(s);
  });
}

async function gas(p){
  return kirimKeServer(p);
}

/* Jalur utama fetch; JSONP hanya cadangan. Kalau keduanya gagal,
   sebab dari jalur utama yang dilaporkan — bukan sekadar "timeout". */
async function kirimKeServer(params){
  const q = Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  const url = GAS_URL + '?' + q;

  let sebabUtama = '';
  try {
    const r = await fetch(url);
    if(!r.ok) {
      sebabUtama = 'server menjawab ' + r.status + ' ' + r.statusText;
    } else {
      const teks = await r.text();
      if(/^\s*<(!DOCTYPE|html)/i.test(teks)){
        throw new Error('Server mengembalikan halaman web, bukan data. Biasanya berarti deployment Apps Script perlu diatur ulang ke "Who has access: Anyone".');
      }
      let d;
      try { d = JSON.parse(teks); }
      catch(e){ throw new Error('Jawaban server tidak terbaca: ' + teks.slice(0, 120)); }
      if(d && d.error) throw new Error(d.error);
      return d;
    }
  } catch(e){
    if(!sebabUtama) sebabUtama = e.message;
    // error dari server sendiri tidak perlu diulang lewat jalur cadangan
    if(/password|action tidak dikenal|tidak ditemukan|halaman web|tidak terbaca/i.test(sebabUtama)){
      throw new Error(sebabUtama);
    }
  }

  try {
    const d = await jsonp(url);
    if(d && d.error) throw new Error(d.error);
    return d;
  } catch(e2){
    throw new Error(sebabUtama || e2.message);
  }
}

/* v112: unduh PDF langsung (tanpa jendela cetak) — file masuk folder Downloads
   seperti unduhan biasa. Pustaka dimuat saat tombol ditekan pertama kali. */
let pustakaPdf = null;
function muatPustakaPdf(){
  if(window.html2pdf) return Promise.resolve();
  if(pustakaPdf) return pustakaPdf;
  pustakaPdf = new Promise((ok, gagal) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload = ok; s.onerror = () => { pustakaPdf = null; gagal(new Error('Pustaka PDF gagal dimuat — cek koneksi internet')); };
    document.head.appendChild(s);
  });
  return pustakaPdf;
}
async function unduhPdf(){
  const el = document.querySelector('.kertas'); if(!el) return;
  const btn = document.getElementById('btn-unduh');
  const nama = (document.title.split(' — ')[0] || 'SPK').replace(/[^A-Za-z0-9._-]+/g, '-') + '.pdf';
  btn.disabled = true; const teks = btn.textContent; btn.textContent = 'Menyiapkan PDF…';
  /* salinan berukuran A4 tetap (794px), ditaruh di pojok kiri-atas di belakang
     halaman — supaya hasil PDF tidak terpotong oleh posisi/lebar layar HP */
  const wadah = document.createElement('div');
  wadah.style.cssText = 'position:absolute;left:0;top:0;width:794px;z-index:-1;background:#fff;';
  const salin = el.cloneNode(true);
  salin.classList.add('mode-pdf');
  salin.style.cssText = 'width:794px;max-width:none;margin:0;box-shadow:none;';
  wadah.appendChild(salin);
  document.body.appendChild(wadah);
  const posisi = window.scrollY;
  try{
    await muatPustakaPdf();
    window.scrollTo(0, 0);
    await html2pdf().set({
      margin: [6, 6, 6, 6],
      filename: nama,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all'] }
    }).from(salin).save();
    setStatus('PDF tersimpan: ' + nama + ' (folder Download)');
  }catch(err){
    setStatus('Gagal membuat PDF: ' + err.message + '. Pakai tombol Cetak sebagai cadangan.', true);
  }
  wadah.remove();
  window.scrollTo(0, posisi);
  btn.disabled = false; btn.textContent = teks;
}

function setStatus(t, err){ const e = document.getElementById('status'); e.textContent = t; e.className = err ? 'err' : ''; }

async function muat(){
  if(noManual && namaEkspedisi){
    try{
      const d = await gas({action:'spk_manual', no:noManual, ekspedisi:namaEkspedisi});
      renderManual(d);
      document.getElementById('btn-unduh').disabled = false;
      setStatus('Data terbaru · ' + new Date().toLocaleTimeString('id-ID'));
      document.title = (d.spk && d.spk.nomor ? d.spk.nomor.replace(/\//g,'-') : 'SPK') + ' — UNIFAM';
    }catch(err){
      setStatus('Gagal memuat: ' + err.message, true);
      document.getElementById('isi').innerHTML = '<div class="kosong">' + esc(err.message) + '</div>';
    }
    return;
  }
  if((!idOrder && !idLelang) || !namaEkspedisi){
    document.getElementById('isi').innerHTML = '<div class="kosong">Link SPK tidak lengkap.</div>';
    setStatus('Link tidak lengkap', true); return;
  }
  try{
    const d = await gas({action:'spk_data', idOrder, idLelang, ekspedisi:namaEkspedisi});
    render(d);
    document.getElementById('btn-unduh').disabled = false;
    setStatus('Data terbaru · ' + new Date().toLocaleTimeString('id-ID'));
    document.title = (d.spk && d.spk.nomor ? d.spk.nomor.replace(/\//g,'-') : 'SPK') + ' — UNIFAM';
  }catch(err){
    setStatus('Gagal memuat: ' + err.message, true);
    document.getElementById('isi').innerHTML = '<div class="kosong">' + esc(err.message) + '</div>';
  }
}

function render(d){
  const o = d.order, l = d.lelang, h = d.harga || {}, s = d.spk || {}, k = d.konfirmasi;
  /* semua kejadian harga diurutkan menurut waktu (dd/mm/yyyy hh:mm) */
  const kunciW = w => { const m = String(w||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
    return m ? `${m[3]}${m[2].padStart(2,'0')}${m[1].padStart(2,'0')}${m[4].padStart(2,'0')}${m[5]}` : ''; };
  const kejadian = [];
  if(h.awal && h.awal.harga){
    kejadian.push({w:h.awal.waktu, html:`<tr><td class="m">${esc(h.awal.waktu) || '—'}</td><td>Penawaran diajukan ${esc(o.ekspedisi)} lewat akun ekspedisi</td><td class="r">${angka(h.awal.harga)}</td></tr>`});
  } else {
    kejadian.push({w:'', html:`<tr><td class="m">—</td><td>Ditunjuk langsung oleh UNIFAM (tanpa penawaran di lelang ini)</td><td class="r">—</td></tr>`});
  }
  (h.riwayat || []).forEach(r => kejadian.push({w:r.waktu, html:`<tr><td class="m">${esc(r.waktu)}</td><td>Diubah UNIFAM${r.alasan ? ' — ' + esc(r.alasan) : ''}<br><span style="color:var(--muted);font-size:12px">dari ${angka(r.lama)}</span></td><td class="r">${angka(r.baru)}</td></tr>`}));
  if(!(h.riwayat || []).length && h.catatanLama){
    kejadian.push({w:'', html:`<tr><td class="m">—</td><td>Diubah UNIFAM: ${esc(h.catatanLama)}</td><td class="r">${angka(h.berlaku)}</td></tr>`});
  }
  (h.semuaSetuju || []).forEach(x => kejadian.push({w:x.waktu, html:`<tr><td class="m">${esc(x.waktu)}</td><td>Disetujui ${esc(o.ekspedisi)} lewat link konfirmasi${x.harga !== h.berlaku ? ' <i>(harga lama, sudah tidak berlaku)</i>' : ''}</td><td class="r">${angka(x.harga)}</td></tr>`}));
  kejadian.forEach((k,i) => k.i = i);
  kejadian.sort((a,b) => (kunciW(a.w) || '0').localeCompare(kunciW(b.w) || '0') || a.i - b.i);
  const baris = kejadian.map(k => k.html);

  const sah = h.setuju && h.setuju.sah;
  const kotakSetuju = sah
    ? `<div class="stempel">✓ DISETUJUI DIGITAL</div><br>${esc(o.ekspedisi)}, via akun ekspedisi<br><span class="m">${esc(h.setuju.waktu)} · harga ${rp(h.setuju.harga)}</span>`
    : `<div class="stempel belum">BELUM DISETUJUI</div><br><span class="catatan-merah">${h.setuju
        ? 'Persetujuan terakhir (' + esc(h.setuju.waktu) + ', ' + rp(h.setuju.harga) + ') sudah gugur karena harga berubah.'
        : 'Ekspedisi belum menyetujui harga ini lewat link konfirmasi.'}</span>`;

  const jadwal = (l.jadwalTanggal || l.tanggalMuat || '—') + (l.jadwalJam ? ', jam ' + l.jadwalJam : '');
  document.getElementById('isi').innerHTML = `
  <div class="kertas">
    <div class="watermark">UNIFAM</div>
    <div class="kop">
      <img src="${LOGO}" alt="UNIFAM">
      <div><div class="pt">PT. UNIFAM</div><div class="al">Divisi Logistik &amp; Transportasi · Gudang Cikande</div></div>
      <div class="kanan"><div class="jenis">SURAT PERINTAH KIRIM</div><div class="nomor">${esc(s.nomor)}</div></div>
    </div>
    <h2>SURAT PERINTAH KIRIM</h2>
    <div class="sub">Bukti kesepakatan harga angkutan — berlaku untuk satu No Order</div>
    <table class="info">
      <tr><td>No Order</td><td class="m"><b>${esc(o.noOrder || l.noOrder || '—')}</b></td></tr>
      <tr><td>Ekspedisi</td><td><b>${esc(o.ekspedisi)}</b></td></tr>
      <tr><td>Rute</td><td>Cikande → ${esc(l.kota)}</td></tr>
      <tr><td>Penerima</td><td>${esc(l.customer)}${l.alamat ? '<br><span style="color:var(--muted);font-size:12px">' + esc(l.alamat) + '</span>' : ''}</td></tr>
      <tr><td>Tipe armada</td><td>${esc(l.tipeMobil)}${l.karton ? ' · ' + angka(l.karton) + ' karton' : ''}${l.cbm ? ' · ' + Number(l.cbm).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' CBM' : ''}</td></tr>
      <tr><td>Jadwal muat</td><td>${esc(jadwal)}</td></tr>
      <tr><td>Dasar penunjukan</td><td>Lelang ${esc(l.id)}${l.batasWaktu ? ' (ditutup ' + esc(l.batasWaktu) + ')' : ''}${l.alasanPilih ? '<br><span style="color:var(--muted);font-size:12px">Catatan pemilihan: ' + esc(l.alasanPilih) + '</span>' : ''}</td></tr>
      ${k && (k.noPolisi || k.noKontener) ? `<tr><td>Armada</td><td>${esc(k.noPolisi)}${k.noKontener ? ' · kontener ' + esc(k.noKontener) : ''}${k.namaDriver ? ' · ' + esc(k.namaDriver) : ''}</td></tr>` : ''}
      ${o.status === 'batal' ? `<tr><td>Status</td><td style="color:var(--red);font-weight:700">ORDER DIBATALKAN</td></tr>` : ''}
    </table>

    <div class="bagian">Riwayat harga</div>
    <table class="tabel">
      <tr><th style="width:132px">Waktu</th><th>Keterangan</th><th class="r" style="width:130px">Harga</th></tr>
      ${baris.join('')}
      <tr class="final"><td colspan="2">HARGA YANG BERLAKU / DITAGIHKAN</td><td class="r">${h.berlaku ? rp(h.berlaku) : '—'}</td></tr>
    </table>
    <div class="syarat">All in — termasuk TKBM, stripping, dan krani. Belum termasuk PPN.
      Tagihan di luar harga ini tanpa persetujuan tertulis baru dari PT. UNIFAM tidak dapat diproses.</div>

    <div class="ttd">
      <div class="kotak"><div class="siapa">Diterbitkan oleh</div>PT. UNIFAM — Logistik &amp; Transportasi<br>
        ${o.waktuBuat ? '<span class="m">Order dibuat ' + esc(o.waktuBuat) + '</span>' : ''}</div>
      <div class="kotak"><div class="siapa">Persetujuan ekspedisi</div>${kotakSetuju}</div>
    </div>
    <div class="kaki"><span>Kode cek: ${esc(s.kode)}</span><span>Dicetak ${esc(s.dicetak)} dari aplikasi Lelang UNIFAM</span></div>
  </div>`;
}
/* ===================== v111: SPK ORDER MANUAL ===================== */
function renderManual(d){
  const pl = d.plan || {}, s = d.spk || {};
  const unit = d.unit || [];
  const kejadian = [];
  if(pl.harga) kejadian.push(`<tr><td class="m">${esc(pl.tanggal) || '—'}</td><td>Order dibuat UNIFAM di Pesanan Armada${pl.sales ? ' (sales ' + esc(pl.sales) + ')' : ''}</td><td class="r">${angka(pl.harga)}</td></tr>`);
  unit.forEach((u,i) => {
    const sh = u.statusHarga;
    let ket;
    if(/tidak tersedia/i.test(u.status)) ket = `${esc(d.ekspedisi)} menyatakan armada <b>tidak tersedia</b>`;
    else if(/^sesuai$/i.test(sh)) ket = `Dikonfirmasi ${esc(d.ekspedisi)}: <b>harga sesuai</b>`;
    else if(/tidak sesuai/i.test(sh)) ket = `Dikonfirmasi ${esc(d.ekspedisi)}: <b>harga tidak sesuai</b>, mengajukan harga sendiri${u.alasan ? ' — ' + esc(u.alasan) : ''}`;
    else ket = `Armada dikonfirmasi ${esc(d.ekspedisi)} (tanpa konfirmasi harga)`;
    ket += unit.length > 1 ? ` <span style="color:var(--muted);font-size:12px">· unit ${i+1}${u.noPolisi ? ' ' + esc(u.noPolisi) : ''}</span>` : '';
    kejadian.push(`<tr><td class="m">${esc(u.waktu) || '—'}</td><td>${ket}</td><td class="r">${u.harga ? angka(u.harga) : '—'}</td></tr>`);
  });

  const st = d.statusHarga;
  const kotak = st === 'sesuai'
    ? `<div class="stempel">✓ DISETUJUI EKSPEDISI</div><br>${esc(d.ekspedisi)}, lewat konfirmasi Pesanan Armada<br><span class="m">${esc((unit.find(u => /^sesuai$/i.test(u.statusHarga)) || {}).waktu || '')} · harga ${rp(d.hargaUnit)}</span>`
    : st === 'beda'
      ? `<div class="stempel" style="border-color:var(--amber);color:var(--amber)">HARGA DIAJUKAN EKSPEDISI</div><br><span style="font-size:12px">${esc(d.ekspedisi)} mengisi harga ${rp(d.hargaUnit)}${pl.harga ? ', berbeda dari harga order UNIFAM ' + rp(pl.harga) : ''}. Pastikan sudah disepakati sebelum dibayar.</span>`
      : `<div class="stempel belum">BELUM ADA KONFIRMASI HARGA</div><br><span class="catatan-merah">Ekspedisi belum memilih "Sesuai" / "Tidak sesuai" untuk harga order ini di Pesanan Armada. Harga di atas adalah harga order UNIFAM.</span>`;

  const unitTabel = unit.length ? `<div class="bagian">Armada</div><table class="tabel">
    <tr><th>No Polisi</th><th>Kontener</th><th>Sopir</th><th>Kapal / ETD</th><th>Status</th></tr>
    ${unit.map(u => `<tr><td class="m">${esc(u.noPolisi) || '—'}</td><td class="m">${esc(u.noKontener) || '—'}</td><td>${esc(u.sopir) || '—'}</td>
      <td>${esc(u.kapal) || '—'}${u.etd ? '<br><span class="m" style="font-size:12px">ETD ' + esc(u.etd) + '</span>' : ''}</td><td>${esc(u.status) || '—'}</td></tr>`).join('')}
  </table>` : '';

  const jadwal = (pl.tanggal || (unit[0] && unit[0].tglMuat) || '—') + (pl.jam && /\d/.test(pl.jam) ? ', jam ' + pl.jam : '');
  document.getElementById('isi').innerHTML = `
  <div class="kertas">
    <div class="watermark">UNIFAM</div>
    <div class="kop">
      <img src="${LOGO}" alt="UNIFAM">
      <div><div class="pt">PT. UNIFAM</div><div class="al">Divisi Logistik &amp; Transportasi · Gudang Cikande</div></div>
      <div class="kanan"><div class="jenis">SURAT PERINTAH KIRIM</div><div class="nomor">${esc(s.nomor)}</div></div>
    </div>
    <h2>SURAT PERINTAH KIRIM</h2>
    <div class="sub">Bukti kesepakatan harga angkutan — order langsung (non-lelang)</div>
    <table class="info">
      <tr><td>No Order</td><td class="m"><b>${esc(d.noOrder)}</b></td></tr>
      <tr><td>Ekspedisi</td><td><b>${esc(d.ekspedisi)}</b></td></tr>
      <tr><td>Rute</td><td>Cikande → ${esc(d.kota)}</td></tr>
      <tr><td>Penerima</td><td>${esc(d.customer)}${d.alamat ? '<br><span style="color:var(--muted);font-size:12px">' + esc(d.alamat) + '</span>' : ''}</td></tr>
      <tr><td>Tipe armada</td><td>${esc(d.tipe)}${pl.karton ? ' · ' + angka(pl.karton) + ' karton' : ''}${pl.cbm ? ' · ' + Number(pl.cbm).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' CBM' : ''}${unit.length > 1 ? ' · ' + unit.length + ' unit' : ''}</td></tr>
      <tr><td>Jadwal muat</td><td>${esc(jadwal)}</td></tr>
      <tr><td>Dasar penunjukan</td><td>Order langsung UNIFAM lewat aplikasi Pesanan Armada (tanpa lelang)</td></tr>
      ${d.dibatalkan ? `<tr><td>Status</td><td style="color:var(--red);font-weight:700">ORDER DIHAPUS / DIBATALKAN DI PESANAN ARMADA</td></tr>` : ''}
    </table>
    ${unitTabel}
    <div class="bagian">Riwayat harga</div>
    <table class="tabel">
      <tr><th style="width:132px">Waktu</th><th>Keterangan</th><th class="r" style="width:130px">Harga</th></tr>
      ${kejadian.join('') || '<tr><td colspan="3">—</td></tr>'}
      <tr class="final"><td colspan="2">HARGA YANG BERLAKU / DITAGIHKAN${unit.length > 1 ? ' (per unit)' : ''}</td><td class="r">${d.hargaUnit ? rp(d.hargaUnit) : '—'}</td></tr>
      ${unit.length > 1 && d.total ? `<tr class="final"><td colspan="2">TOTAL ${unit.filter(u => !/tidak tersedia/i.test(u.status)).length || unit.length} UNIT</td><td class="r">${rp(d.total)}</td></tr>` : ''}
    </table>
    <div class="syarat">All in — termasuk TKBM, stripping, dan krani. Belum termasuk PPN.
      Tagihan di luar harga ini tanpa persetujuan tertulis baru dari PT. UNIFAM tidak dapat diproses.</div>
    <div class="ttd">
      <div class="kotak"><div class="siapa">Diterbitkan oleh</div>PT. UNIFAM — Logistik &amp; Transportasi<br>
        <span class="m">Order ${esc(d.noOrder)}</span></div>
      <div class="kotak"><div class="siapa">Persetujuan ekspedisi</div>${kotak}</div>
    </div>
    <div class="kaki"><span>Kode cek: ${esc(s.kode)}</span><span>Dicetak ${esc(s.dicetak)} dari aplikasi Lelang UNIFAM</span></div>
  </div>`;
}

muat();
</script>
</body>
</html>
